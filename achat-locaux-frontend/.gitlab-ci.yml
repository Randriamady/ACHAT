stages:
  - build
  - deploy

variables:
  FRONTEND_DIR: /opt/data/achat-locaux-frontend
  DEPLOY_USER: gitlab-runner
  DEPLOY_HOST: srv-app-01

frontend:build:
  stage: build
  tags:
    - srv-gl-runner-01-docker
  image: node:22-alpine
  script:
    - npm ci
    - npm run build

  artifacts:
    paths:
      - dist
  only:
    - main

deploy:frontend:
  stage: deploy
  tags:
    - srv-gl-runner-01-shell
  script:
    - rsync -avz --delete dist/ $DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_DIR/
  dependencies:
    - frontend:build
  only:
    - main
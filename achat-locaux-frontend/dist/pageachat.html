<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="./src/libs/xlsx.full.min.js"></script>
<title>Tableur DA - Excel-Like</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:Arial,sans-serif;font-size:12px;color:#000;background:#f8f9fa;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;min-height:0}

  #toolbar{display:flex;align-items:center;gap:2px;padding:3px 8px;background:#fff;border-bottom:1px solid #ccc;flex-wrap:wrap;flex-shrink:0;min-height:32px}
  #toolbar button{padding:3px 8px;border:1px solid #ccc;background:#fff;border-radius:3px;cursor:pointer;font-size:11.5px;height:24px;min-width:24px;display:inline-flex;align-items:center;justify-content:center}
  #toolbar button:hover{background:#e8f0fe}
  #toolbar button:disabled{opacity:.4;cursor:not-allowed}
  #toolbar .sep{width:1px;height:16px;background:#ccc;margin:0 2px}
  #saveStatus{margin-left:auto;display:flex;align-items:center;gap:5px;padding:2px 10px;background:#f0f8f4;border:1px solid #c8e6d0;border-radius:3px;font-size:11px;color:#0f5c34;white-space:nowrap;font-weight:500}
  #saveStatus.saving{background:#e8f0fe;border-color:#b8ccff;color:#1a73e8}
  #saveStatus.error{background:#fce8e6;border-color:#f5c6c0;color:#d93025}

  #formulaBar{display:flex;align-items:center;background:#fff;border-bottom:2px solid #0f9d58;height:26px;flex-shrink:0}
  #cellRef{width:90px;text-align:center;font-weight:bold;padding:2px 6px;border-right:1px solid #ccc;background:#fafafa;font-size:11px;line-height:22px;cursor:pointer}
  #cellRef:hover{background:#e8f0fe}
  #fx{padding:0 8px;color:#666;font-style:italic;font-weight:bold;font-size:11px}
  #formulaInput{flex:1;border:none;padding:3px 8px;font-family:Consolas,monospace;font-size:12px;outline:none;height:22px}
  #formulaInput[readonly]{background:#fffde7;color:#7b5c00;cursor:not-allowed}

  #gridWrap{flex:1;overflow:auto;background:#fff;position:relative}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed;background:#fff}
  th,td{border-right:1px solid #bfbfbf;border-bottom:1px solid #bfbfbf;padding:0}

  thead th{position:sticky;top:0;z-index:10;background:#e8eaed;font-weight:bold;text-align:center;height:24px;min-width:110px;font-size:11px;color:#333;border-bottom:2px solid #808080;user-select:none;cursor:pointer;overflow:hidden;white-space:nowrap;padding:0 4px}
  thead th:hover{background:#d0d3d6}
  thead th.selected{background:#0f9d58!important;color:#fff!important}
  thead th:first-child{left:0;z-index:11;width:44px;min-width:44px;background:#dadce0;border-right:2px solid #808080}
  thead th:first-child.selected{background:#0f9d58!important;color:#fff!important}

  tbody th{position:sticky;left:0;z-index:9;background:#f1f3f4;font-weight:normal;text-align:center;width:44px;min-width:44px;height:24px;font-size:11px;color:#555;border-right:2px solid #808080;user-select:none;cursor:pointer}
  tbody th:hover{background:#d0d3d6}
  tbody th.selected{background:#0f9d58!important;color:#fff!important}

  td{height:24px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;cursor:cell;user-select:none;font-size:12px;outline:none;position:relative;width:110px;min-width:110px}
  td:hover{background:#f0f8f4}
  td.num{text-align:right}
  td.err{color:#d93025;font-weight:bold}

  td.auto-calc{background:#fffde7 !important;color:#7b5c00;font-weight:600;cursor:not-allowed !important}
  td.auto-calc:hover{background:#fffde7 !important}
  td.auto-calc.active{box-shadow:inset 0 0 0 2px #f9ab00 !important;background:#fffde7 !important}
  td.auto-calc.sel{background:#fff9c4 !important}

  td.sel{background:#cce8d4!important}
  td.active{box-shadow:inset 0 0 0 2px #0f9d58;background:#fff!important;position:relative;z-index:8}
  td.edit{cursor:text;user-select:text;box-shadow:inset 0 0 0 2px #0f9d58;background:#fff!important;overflow:hidden;z-index:20;text-overflow:clip}
  td.row-selected{background:#cce8d4!important}
  td.col-selected{background:#cce8d4!important}
  td.all-selected{background:#cce8d4!important}
  td.row-selected.active, td.col-selected.active, td.all-selected.active{background:#fff!important}
  td.cut{opacity:.4}
  td.fill-preview{background:#cce8d4!important;border:1px dashed #0f9d58!important}
  td.found{background:#fff59d!important;box-shadow:inset 0 0 0 2px #f9ab00}

  td.formula-ref{
    background:#dbeafe !important;
    box-shadow:inset 0 0 0 2px #1a73e8 !important;
    position:relative; z-index:6;
  }

  td.multi-selected{
    background:#b3d9ff !important;
    box-shadow:inset 0 0 0 1px #1a73e8 !important;
  }

  tbody tr[data-row="0"] td{background:#f0f8f4 !important;font-weight:600;border-bottom:2px solid #808080;cursor:not-allowed !important}
  tbody tr[data-row="0"] td:hover{background:#f0f8f4 !important}
  tbody tr[data-row="0"] td.has-filter{background:#fff3cd !important}
  #grid tbody tr[data-row="0"] td{position:sticky;top:24px;z-index:7}
  #grid tbody tr[data-row="0"] th{position:sticky;top:24px;z-index:9}

  .fill-handle{position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:#0f9d58;border:1px solid #fff;border-radius:1px;cursor:crosshair;z-index:15;display:none}
  td.active .fill-handle{display:block}
  td.edit .fill-handle{display:none}
  td.auto-calc .fill-handle{display:none !important}

  td.has-dropdown::after{content:"▾";position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:10px;color:#1a73e8;pointer-events:none;background:rgba(255,255,255,.9);padding:0 2px;border-radius:2px;font-weight:bold}
  td.has-dropdown{padding-right:16px;cursor:pointer}

  .filter-icon{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:9px;padding:0 3px;border-radius:2px;background:rgba(0,0,0,.1);cursor:pointer;opacity:.6;user-select:none}
  .filter-icon:hover{opacity:1;background:rgba(0,0,0,.2)}
  td.has-filter .filter-icon{background:#ff9800;color:#fff;opacity:1}
  tbody tr[data-row="0"] td{padding-right:18px}
  tr.filtered-out{display:none}

  /* ✅ Dropdown : injecté DANS le td, position absolute top:100% → collé au bas */
  #dropdownMenu{
    position:absolute;
    top:100%;
    left:0;
    background:#fff;
    border:1px solid #1a73e8;
    border-top:none;
    border-radius:0 0 4px 4px;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
    padding:0;
    margin:0;
    z-index:99999;
    display:none;
    min-width:100%;
    max-height:320px;
    overflow-y:auto;
    font-size:12.5px;
  }
  #dropdownMenu.show{display:block}
  #dropdownMenu .dd-item{padding:6px 14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;line-height:1.3}
  #dropdownMenu .dd-item:hover{background:#e8f0fe;color:#1a73e8}
  #dropdownMenu .dd-item.active{background:#0f9d58;color:#fff;font-weight:600}
  #dropdownMenu .dd-search{padding:6px 10px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;margin:0;z-index:1}
  #dropdownMenu .dd-search input{width:100%;padding:4px 8px;border:1px solid #ccc;border-radius:3px;font-size:12px;outline:none}
  #dropdownMenu .dd-free-hint{padding:6px 14px;font-size:11px;color:#666;background:#f8f9fa;border-top:1px solid #eee;font-style:italic}
  #dropdownMenu .dd-free-hint b{color:#0f9d58}

  /* ✅ td contenant un dropdown ouvert : laisser déborder */
  td.dropdown-open{
    overflow:visible !important;
    z-index:99998 !important;
    background:#fff !important;
  }

  /* ✅ Filtre : injecté DANS le td d'en-tête, position absolute top:100% → collé au bas */
  #filterMenu{
    position:absolute;
    top:100%;
    left:0;
    background:#fff;
    border:1px solid #1a73e8;
    border-top:none;
    border-radius:0 0 6px 6px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    padding:10px;
    margin:0;
    z-index:99999;
    display:none;
    min-width:240px;
    font-size:12.5px;
  }
  #filterMenu.show{display:block}
  #filterMenu h4{margin-bottom:8px;font-size:12px;color:#555}
  #filterMenu label{display:block;padding:4px 6px;cursor:pointer;border-radius:3px;font-size:12px}
  #filterMenu label:hover{background:#e8f0fe}
  #filterMenu input[type=text]{width:100%;padding:5px 8px;border:1px solid #ccc;border-radius:3px;margin-bottom:8px;font-size:12px}
  #filterMenu .filter-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #eee}
  #filterMenu .filter-actions button{flex:1;padding:5px;border:1px solid #ccc;background:#fff;border-radius:3px;cursor:pointer;font-size:11.5px}
  #filterMenu .filter-actions button.primary{background:#0f9d58;color:#fff;border-color:#0f9d58}
  #filterMenu .values-list{max-height:200px;overflow-y:auto;border:1px solid #eee;border-radius:3px;padding:3px}

  /* ✅ td d'en-tête contenant le filtre ouvert : laisser déborder */
  td.filter-open{
    overflow:visible !important;
    z-index:99998 !important;
  }

  #contextMenu{position:fixed;background:#fff;border:1px solid #ccc;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:4px 0;z-index:100000;display:none;min-width:220px;font-size:12.5px}
  #contextMenu.show{display:block}
  #contextMenu .ctx-item{padding:6px 16px;cursor:pointer;white-space:nowrap;display:flex;justify-content:space-between;gap:20px}
  #contextMenu .ctx-item:hover{background:#e8f0fe;color:#1a73e8}
  #contextMenu .ctx-item .shortcut{color:#999;font-size:10.5px}
  #contextMenu .ctx-sep{height:1px;background:#eee;margin:4px 0}
  #contextMenu .ctx-item.danger:hover{background:#fce8e6;color:#d93025}
  #contextMenu .ctx-item.disabled{color:#bbb;cursor:not-allowed;pointer-events:none}

  #unifiedBar{display:flex;align-items:stretch;background:#f1f3f4;border-top:1px solid #ccc;height:28px;font-size:11px;flex-shrink:0;gap:0}
  #sheetsZone{display:flex;align-items:center;flex:1;overflow:hidden;min-width:0;border-right:1px solid #bfbfbf}
  #sheetsLabel{padding:0 8px;font-size:9px;color:#666;font-weight:700;text-transform:uppercase;white-space:nowrap;border-right:1px solid #e0e0e0;display:flex;align-items:center;align-self:stretch;letter-spacing:.04em}
  #sheetTabs{display:flex;align-items:center;gap:2px;padding:2px 6px;flex:1;overflow-x:auto;min-width:0}
  .sheet-tab{display:flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;font:inherit;font-size:10.5px;color:#555;white-space:nowrap;flex-shrink:0;height:20px}
  .sheet-tab:hover{background:#e8eaed}
  .sheet-tab.active{background:#0f9d58;color:#fff;font-weight:600;border-color:#0b7c44}
  .sheet-tab .tab-color{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
  .sheet-tab.active .tab-color{box-shadow:0 0 0 1.5px #fff}
  .sheet-tab .tab-count{font-size:9px;background:rgba(0,0,0,.08);padding:0 4px;border-radius:7px;font-weight:600;min-width:15px;text-align:center;line-height:12px}
  .sheet-tab.active .tab-count{background:rgba(255,255,255,.25);color:#fff}
  #btnAddSheet{width:20px;height:20px;border:1px dashed #999;border-radius:50%;background:transparent;cursor:pointer;color:#666;font-size:12px;font-weight:600;margin-left:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #btnAddSheet:hover{background:#0f9d58;color:#fff;border-color:#0f9d58;border-style:solid}
  #statsZone{display:flex;align-items:center;gap:10px;padding:0 10px;background:#fafbfc;flex-shrink:0;align-self:stretch}
  #statsZone .stat{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  #statsZone .stat .lbl{font-size:8.5px;color:#666;text-transform:uppercase;font-weight:700}
  #statsZone .stat .val{font-size:11px;color:#0f5c34;font-weight:700}
  #statsZone .stat .val.muted{color:#999;font-weight:400}

  #toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(80px);background:#323232;color:#fff;padding:8px 16px;border-radius:4px;font-size:12px;opacity:0;transition:all .3s;z-index:100001;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #formulaHint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a73e8;color:#fff;padding:7px 16px;border-radius:5px;font-size:12px;display:none;z-index:99999}
  #formulaHint.show{display:block}
  #searchBox{position:fixed;top:8px;right:20px;background:#fff;border:1px solid #1a73e8;border-radius:4px;padding:6px 10px;z-index:100002;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);gap:6px;align-items:center}
  #searchBox.show{display:flex}
  #searchBox input{padding:4px 8px;border:1px solid #ccc;border-radius:3px;font-size:12px;outline:none;width:200px}
  #searchBox button{padding:4px 8px;border:1px solid #ccc;background:#fff;border-radius:3px;cursor:pointer;font-size:11px}
  #searchBox button:hover{background:#e8f0fe}
</style>

<script>
"use strict";

/* ============================================================
   UTILITAIRES DE RÉFÉRENCE
   ============================================================ */
function colName(i){
  let s="",n=i+1;
  while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=(n-1-r)/26|0}
  return s;
}
function colIndex(name){
  let n=0;
  for(let i=0;i<name.length;i++)n=n*26+(name.charCodeAt(i)-64);
  return n-1;
}
function parseRef(ref){
  if(!ref) return null;
  const m=/^\$?([A-Z]+)\$?(\d+)$/.exec(String(ref).toUpperCase());
  return m?{c:colIndex(m[1]),r:parseInt(m[2],10)-1}:null;
}
function refName(c,r){return colName(c)+(r+1)}
function cleanRef(ref){return String(ref).replace(/\$/g,"").toUpperCase()}

function activeSheet(){ return sheets[activeSheetIdx] }
function getSheetSetting(sheet, ownerName){
  if(!sheet) return null;
  if(sheet.type === "colonne"){
    const owner = IN_PROGRESS_OWNERS.find(function(item){ return item.name === ownerName });
    return owner ? sheetSettingsByType.get(owner.key) || null : null;
  }
  return sheetSettingsByType.get(sheet.type) || null;
}
function isSheetVisible(sheet, ownerName){
  if(!sheet || !MANAGED_SHEET_TYPES.has(sheet.type)) return true;
  if(!sheetSettingsLoaded) return false;
  return getSheetSetting(sheet, ownerName)?.visible === true;
}
function getSheetDisplayName(sheet, ownerName){
  return getSheetSetting(sheet, ownerName)?.name || ownerName || sheet?.name || "";
}
function getFirstVisibleSheetLocation(){
  for(let idx = 0; idx < sheets.length; idx++){
    const sheet = sheets[idx];
    if(sheet.type === "colonne"){
      const owner = IN_PROGRESS_OWNERS.find(function(item){ return isSheetVisible(sheet, item.name) });
      if(owner) return {index: idx, ownerName: owner.name};
    }else if(isSheetVisible(sheet)){
      return {index: idx, ownerName: null};
    }
  }
  return null;
}
function ensureActiveSheetVisible(){
  const sheet = activeSheet();
  if(sheet && isSheetVisible(sheet, sheet.type === "colonne" ? activeOwnerFilter : undefined)) return true;
  const firstVisible = getFirstVisibleSheetLocation();
  if(!firstVisible) return false;
  activeSheetIdx = firstVisible.index;
  if(firstVisible.ownerName) activeOwnerFilter = firstVisible.ownerName;
  syncActiveSheetRefs();
  return true;
}
function isDataSheet(sheet){ return sheet && ["colonne", "tous", "livre", "attente_comite", "valide_comite"].includes(sheet.type) }
function isFilterableSheet(sheet){ return sheet && sheet.type !== "parametres" }
function getSheetRowCapacity(sheet){
  let lastUsedRow = 0;
  if(sheet && sheet.cells){
    sheet.cells.forEach(function(cell, ref){
      if(!cell || cell.v == null || cell.v === "") return;
      const position = parseRef(ref);
      if(position && position.r > lastUsedRow) lastUsedRow = position.r;
    });
  }
  const emptyRows = sheet && ["colonne", "tous"].includes(sheet.type) ? OWNER_EMPTY_ROWS : EMPTY_ROWS_PER_SHEET;
  return Math.min(EXCEL_MAX_ROWS, Math.max(emptyRows + 1, lastUsedRow + emptyRows + 1));
}
function syncActiveSheetRefs(){
  activeSheet().rows = getSheetRowCapacity(activeSheet());
  cells = activeSheet().cells;
  filters = activeSheet().type === "colonne" ? getOwnerFiltersFor(activeOwnerFilter) : activeSheet().filters;
  currentHeaders = activeSheet().headers || [];
  ROWS = activeSheet().rows;
  COLS = Math.max(15, currentHeaders.length || 20);
  invalidateFilteredRowsCache();
}

function isProtectedCell(ref){
  if(!isDataSheet(activeSheet())) return false;
  const p = parseRef(ref);
  if(!p) return false;
  if(p.r === 0) return true;
  const cfg = currentHeaders[p.c];
  return !!(cfg && cfg.type === "auto");
}

function showProtectionMessage(ref){

  if(p && p.r === 0){ showToast("🔒 Ligne d'en-tête : non modifiable"); return; }
  showToast("🔒 Colonne calculée automatiquement : non modifiable");
}

function invalidateFilteredRowsCache(){
  filteredRowsCache = null;
  filteredRowsCacheKey = "";
}

function buildFilteredRowsCacheKey(){
  const filtersKey = Array.from(filters.entries())
    .sort((a, b) => a[0] - b[0])
    .map(([k, v]) => k + ":" + Array.from(v).sort().join(","))
    .join("|");
  return activeSheetIdx + "|" + filtersKey + "|" + (activeSheet().type === "colonne" ? normalizeOwnerName(activeOwnerFilter) : "");
}

function getFilteredRows(){
  const cacheKey = buildFilteredRowsCacheKey();
  if(filteredRowsCache && filteredRowsCacheKey === cacheKey) return filteredRowsCache;

  const sheet = activeSheet();
  const columns = isDataSheet(sheet) ? getApiColumns(sheet) : [];
  const ownerColumn = sheet.type === "colonne" ? columns.find(c => c.field === "acheteur") : null;
  const selectedOwner = ownerColumn ? normalizeOwnerName(activeOwnerFilter) : "";

  const allRows = columns.length
    ? getPopulatedApiRows(sheet, columns)
    : Array.from(new Set(Array.from(sheet.cells.keys())
        .map(ref => parseRef(ref))
        .filter(p => p && p.r > 0)
        .map(p => p.r))).sort((a, b) => a - b);

  const ownerRows = selectedOwner
    ? allRows.filter(function(row){
        return normalizeOwnerName(evaluate(refName(ownerColumn.col, row))) === selectedOwner;
      })
    : allRows;
  const visibleRows = [];
  for(const r of ownerRows){
    let visible = true;
    filters.forEach(function(acceptedSet, col){
      const v = str(evaluate(refName(col, r)));
      if(!acceptedSet.has(v)) visible = false;
    });
    if(visible) visibleRows.push(r);
  }

  if(isFilterableSheet(sheet)){
    const lastPopulatedRow = allRows.length ? allRows[allRows.length - 1] : 0;
    const owner = selectedOwner
      ? IN_PROGRESS_OWNERS.find(function(item){ return normalizeOwnerName(item.name) === selectedOwner })
      : null;
    const showOwnerEmptyRows = owner
      ? sheetSettingsByType.get(owner.key)?.showEmptyRows !== false
      : true;
    const emptyRowsToShow = ["colonne", "tous"].includes(sheet.type)
      ? (owner
        ? (ownerRows.length > 0 ? OWNER_EMPTY_ROWS : (showOwnerEmptyRows ? 1 : 0))
        : OWNER_EMPTY_ROWS)
      : EMPTY_ROWS_PER_SHEET;
    for(let emptyIndex = 0; emptyIndex < emptyRowsToShow && lastPopulatedRow + emptyIndex + 1 < ROWS; emptyIndex++){
      visibleRows.push(lastPopulatedRow + emptyIndex + 1);
    }
  }

  filteredRowsCache = visibleRows;
  filteredRowsCacheKey = cacheKey;
  return visibleRows;
}

function scrollToOwnerEntryRows(){
  if(!["colonne", "tous"].includes(activeSheet().type)) return;
  const rows = getFilteredRows();
  const fixedHeight = VIRTUAL_ROW_HEIGHT * 2;
  const rowScale = Math.min(
    VIRTUAL_ROW_HEIGHT,
    Math.max(1, (VIRTUAL_MAX_HEIGHT - fixedHeight) / Math.max(1, rows.length))
  );
  const visibleRows = Math.ceil((gridWrap.clientHeight || 600) / VIRTUAL_ROW_HEIGHT);
  const rowCount = Math.min(rows.length, Math.max(60, visibleRows + VIRTUAL_OVERSCAN_ROWS * 2));
  const offset = Math.max(0, rows.length - rowCount);
  gridWrap.scrollTop = fixedHeight + offset * rowScale;
}

function extractFormulaRefs(formula){
  if(!formula || formula.charAt(0) !== "=") return [];
  const refs = [];
  const regex = /\$?([A-Z]+)\$?(\d+)/g;
  let m;
  while((m = regex.exec(formula)) !== null){
    const col = colIndex(m[1]);
    const row = parseInt(m[2], 10) - 1;
    if(col >= 0 && row >= 0 && col < COLS && row < ROWS) refs.push(refName(col, row));
  }
  const rangeRegex = /\$?([A-Z]+)\$?(\d+)\s*:\s*\$?([A-Z]+)\$?(\d+)/g;
  while((m = rangeRegex.exec(formula)) !== null){
    const c1 = colIndex(m[1]), r1 = parseInt(m[2],10)-1;
    const c2 = colIndex(m[3]), r2 = parseInt(m[4],10)-1;
    for(let r = Math.min(r1,r2); r <= Math.max(r1,r2); r++){
      for(let c = Math.min(c1,c2); c <= Math.max(c1,c2); c++){
        if(c >= 0 && r >= 0 && c < COLS && r < ROWS) refs.push(refName(c, r));
      }
    }
  }
  return Array.from(new Set(refs));
}

function updateHighlightedRefs(){
  highlightedRefs.clear();
  const cell = cells.get(currentRef);
  if(!cell || !cell.v) return;
  const v = String(cell.v);
  if(v.charAt(0) !== "=") return;
  extractFormulaRefs(v).forEach(function(r){ highlightedRefs.add(r) });
}

/* ============================================================
   MOTEUR DE FORMULES
   ============================================================ */
function evaluate(ref){
  ref = cleanRef(ref);
  if(valueCache.has(ref)) return valueCache.get(ref);
  if(computing.has(ref)) return "#CYCLE!";
  const cell = cells.get(ref);
  const raw = cell && cell.v != null ? String(cell.v).trim() : "";
  const position = parseRef(ref);
  const isBudgetCode = isDataSheet(activeSheet()) &&
    currentHeaders[position && position.c] &&
    currentHeaders[position.c].header === "Code Budget";
  let result;
  if(raw === ""){
    result = "";
  } else if(raw.charAt(0) === "="){
    computing.add(ref);
    try{ result = evalFormula(raw.slice(1)) }
    catch(e){ result = e && e.message ? e.message : "#ERREUR!" }
    computing.delete(ref);
  } else if(isBudgetCode){
    result = raw;
  } else {
    const numStr = raw.replace(/\s/g,"").replace(",",".");
    if(/^-?\d+(\.\d+)?$/.test(numStr)) result = parseFloat(numStr);
    else result = raw;
  }
  valueCache.set(ref, result);
  return result;
}

function evalFormula(expr){ return evalExpr(expr.trim()); }

function evalExpr(expr){
  expr = expr.trim();
  if(expr === "") return "";

  if(expr.charAt(0) === "(" && expr.charAt(expr.length-1) === ")"){
    let depth = 0, ok = true;
    for(let i=0;i<expr.length;i++){
      if(expr[i] === "(") depth++;
      else if(expr[i] === ")") depth--;
      if(depth === 0 && i < expr.length - 1){ ok = false; break; }
      if(depth < 0){ ok = false; break; }
    }
    if(ok) return evalExpr(expr.slice(1,-1));
  }

  const funcMatch = /^([A-ZÀ-ÿ][A-ZÀ-ÿ0-9._]*)\s*\(/.exec(expr);
  if(funcMatch){
    const fname = funcMatch[1].toUpperCase();
    const openIdx = expr.indexOf("(");
    let depth = 0, closeIdx = -1, inStr = false;
    for(let i = openIdx; i < expr.length; i++){
      const ch = expr[i];
      if(ch === '"' && expr[i-1] !== '\\') inStr = !inStr;
      if(inStr) continue;
      if(ch === "(") depth++;
      else if(ch === ")"){ depth--; if(depth === 0){ closeIdx = i; break; } }
    }
    if(closeIdx === expr.length - 1){
      const argsStr = expr.slice(openIdx + 1, closeIdx);
      return callFunction(fname, splitArgs(argsStr));
    }
  }

  const ops = [["<=",">=","<>","=","<",">"],["&"],["+","-"],["*","/"],["^"]];
  for(let i=0; i<ops.length; i++){
    const split = splitByOp(expr, ops[i]);
    if(split){
      const l = evalExpr(split.left);
      const r = evalExpr(split.right);
      return applyOp(split.op, l, r);
    }
  }

  if(/^\$?[A-Z]+\$?\d+$/.test(expr.toUpperCase())) return evaluate(cleanRef(expr));
  const numStr = expr.replace(",",".");
  if(/^-?\d+(\.\d+)?$/.test(numStr)) return parseFloat(numStr);
  if(expr.charAt(0) === '"' && expr.charAt(expr.length-1) === '"') return expr.slice(1,-1);
  if(expr === "VRAI" || expr === "TRUE") return true;
  if(expr === "FAUX" || expr === "FALSE") return false;
  throw new Error("#NOM?");
}

function splitArgs(s){
  const args = [];
  let depth = 0, current = "", inStr = false;
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(c === '"' && s[i-1] !== '\\') inStr = !inStr;
    if(!inStr){
      if(c === "(") depth++;
      else if(c === ")") depth--;
      else if((c === ";" || c === ",") && depth === 0){ args.push(current.trim()); current = ""; continue; }
    }
    current += c;
  }
  if(current.trim() !== "" || s.trim() === "") args.push(current.trim());
  return args;
}

function splitByOp(expr, opList){
  let depth = 0, inStr = false;
  for(let i = expr.length - 1; i >= 0; i--){
    const c = expr[i];
    if(c === '"' && expr[i-1] !== '\\') inStr = !inStr;
    if(inStr) continue;
    if(c === ")") depth++;
    else if(c === "(") depth--;
    else if(depth === 0){
      for(let k=0; k<opList.length; k++){
        const op = opList[k];
        if(op.length === 2 && i >= 1 && expr.substr(i-1, 2) === op){
          return {op: op, left: expr.slice(0, i-1).trim(), right: expr.slice(i+1).trim()};
        }
      }
      if(opList.indexOf(c) >= 0){
        if(i === 0) continue;
        const prev = expr[i-1];
        if((c === "-" || c === "+") && "+-*/^&<>=(".indexOf(prev) >= 0) continue;
        return {op: c, left: expr.slice(0, i).trim(), right: expr.slice(i+1).trim()};
      }
    }
  }
  return null;
}

function applyOp(op, l, r){
  switch(op){
    case "+": return num(l) + num(r);
    case "-": return num(l) - num(r);
    case "*": return num(l) * num(r);
    case "/": { const d = num(r); if(d === 0) throw new Error("#DIV/0!"); return num(l) / d; }
    case "^": return Math.pow(num(l), num(r));
    case "&": return str(l) + str(r);
    case "=": return compare(l, r) === 0;
    case "<>": return compare(l, r) !== 0;
    case "<": return compare(l, r) < 0;
    case ">": return compare(l, r) > 0;
    case "<=": return compare(l, r) <= 0;
    case ">=": return compare(l, r) >= 0;
  }
  throw new Error("#SYNTAXE!");
}

function expandRange(rangeStr){
  const m = /^\$?([A-Z]+)\$?(\d+)\s*:\s*\$?([A-Z]+)\$?(\d+)$/.exec(rangeStr.toUpperCase());
  if(!m) return null;
  const c1 = colIndex(m[1]), r1 = parseInt(m[2],10)-1;
  const c2 = colIndex(m[3]), r2 = parseInt(m[4],10)-1;
  const out = [];
  for(let r=Math.min(r1,r2); r<=Math.max(r1,r2); r++){
    for(let c=Math.min(c1,c2); c<=Math.max(c1,c2); c++){
      out.push(evaluate(refName(c, r)));
    }
  }
  return out;
}

function expandRangeRefs(rangeStr){
  const m = /^\$?([A-Z]+)\$?(\d+)\s*:\s*\$?([A-Z]+)\$?(\d+)$/.exec(rangeStr.toUpperCase());
  if(!m) return null;
  const c1 = colIndex(m[1]), r1 = parseInt(m[2],10)-1;
  const c2 = colIndex(m[3]), r2 = parseInt(m[4],10)-1;
  const out = [];
  for(let r=Math.min(r1,r2); r<=Math.max(r1,r2); r++){
    for(let c=Math.min(c1,c2); c<=Math.max(c1,c2); c++){
      out.push({ref: refName(c, r), val: evaluate(refName(c, r))});
    }
  }
  return out;
}

function callFunction(name, args){
  if(name === "IF" || name === "SI"){
    if(args.length < 2) throw new Error("#NOMBRE!");
    const condition = evalExpr(args[0]);
    if(truthy(condition)) return evalExpr(args[1]);
    return args.length > 2 ? evalExpr(args[2]) : false;
  }

  const evaluated = args.map(function(a){
    const range = expandRange(a);
    if(range !== null) return range;
    return evalExpr(a);
  });

  const flat = [];
  function walk(a){ if(Array.isArray(a)) a.forEach(walk); else flat.push(a) }
  evaluated.forEach(walk);

  const nums = [];
  flat.forEach(function(v){
    if(typeof v === "number") nums.push(v);
    else if(typeof v === "string" && v !== ""){
      const n = parseFloat(v.replace(",","."));
      if(!isNaN(n)) nums.push(n);
    }
  });

  switch(name){
    case "SOMME": case "SUM": return nums.reduce(function(a,b){return a+b}, 0);
    case "MOYENNE": case "AVERAGE":
      if(!nums.length) throw new Error("#DIV/0!");
      return nums.reduce(function(a,b){return a+b}, 0) / nums.length;
    case "MIN": return nums.length ? Math.min.apply(null, nums) : 0;
    case "MAX": return nums.length ? Math.max.apply(null, nums) : 0;
    case "NB": case "COUNT": return nums.length;
    case "NBVAL": case "COUNTA": return flat.filter(function(v){ return v !== "" && v != null }).length;
    case "NB.VIDE": case "COUNTBLANK": return flat.filter(function(v){ return v === "" || v == null }).length;
    case "SIERREUR": case "IFERROR": {
      if(evaluated.length < 2) throw new Error("#NOMBRE!");
      const v = evaluated[0];
      if(typeof v === "string" && v.charAt(0) === "#") return evaluated[1];
      return v;
    }
    case "ET": case "AND": return flat.every(truthy);
    case "OU": case "OR": return flat.some(truthy);
    case "NON": case "NOT": return !truthy(evaluated[0]);
    case "ABS": return Math.abs(num(evaluated[0]));
    case "RACINE": case "SQRT": { const v = num(evaluated[0]); if(v < 0) throw new Error("#NUM!"); return Math.sqrt(v); }
    case "ARRONDI": case "ROUND": {
      const d = evaluated.length > 1 ? num(evaluated[1]) : 0;
      const f = Math.pow(10, d);
      return Math.round(num(evaluated[0]) * f) / f;
    }
    case "ARRONDI.SUP": case "ROUNDUP": {
      const d = evaluated.length > 1 ? num(evaluated[1]) : 0;
      const f = Math.pow(10, d);
      return Math.ceil(num(evaluated[0]) * f) / f;
    }
    case "ARRONDI.INF": case "ROUNDDOWN": {
      const d = evaluated.length > 1 ? num(evaluated[1]) : 0;
      const f = Math.pow(10, d);
      return Math.floor(num(evaluated[0]) * f) / f;
    }
    case "ENT": case "INT": return Math.floor(num(evaluated[0]));
    case "MOD": { const d = num(evaluated[1]); if(d === 0) throw new Error("#DIV/0!"); return num(evaluated[0]) % d; }
    case "PUISSANCE": case "POWER": return Math.pow(num(evaluated[0]), num(evaluated[1]));
    case "CONCAT": case "CONCATENER": return flat.map(str).join("");
    case "NBCAR": case "LEN": return str(evaluated[0]).length;
    case "MAJUSCULE": case "UPPER": return str(evaluated[0]).toUpperCase();
    case "MINUSCULE": case "LOWER": return str(evaluated[0]).toLowerCase();
    case "GAUCHE": case "LEFT": return str(evaluated[0]).slice(0, evaluated.length > 1 ? num(evaluated[1]) : 1);
    case "DROITE": case "RIGHT": {
      const n = evaluated.length > 1 ? num(evaluated[1]) : 1;
      const s = str(evaluated[0]);
      return n <= 0 ? "" : s.slice(-n);
    }
    case "STXT": case "MID": {
      const s = str(evaluated[0]);
      const start = num(evaluated[1]) - 1;
      const len = evaluated.length > 2 ? num(evaluated[2]) : s.length - start;
      return s.substr(start, len);
    }
    case "TEXTE": case "TEXT": return str(evaluated[0]);
    case "CNUM": case "VALUE": {
      const n = parseFloat(String(evaluated[0]).replace(",","."));
      if(isNaN(n)) throw new Error("#VALEUR!");
      return n;
    }
    case "ALEA": case "RAND": return Math.random();
    case "ALEA.ENTRE.BORNES": case "RANDBETWEEN": {
      const min = Math.ceil(num(evaluated[0]));
      const max = Math.floor(num(evaluated[1]));
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    case "MEDIANE": case "MEDIAN": {
      if(!nums.length) throw new Error("#NOMBRE!");
      const sorted = nums.slice().sort(function(a,b){return a-b});
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid-1] + sorted[mid]) / 2;
    }
    case "SOMME.SI": case "SUMIF": {
      const range = expandRangeRefs(args[0]);
      if(!range) throw new Error("#REF!");
      const crit = evaluated[1];
      const sumRange = args.length > 2 ? expandRangeRefs(args[2]) : range;
      let sum = 0;
      range.forEach(function(cell, i){
        if(matchCriteria(cell.val, crit)){
          const v = numOrNull(sumRange[i] ? sumRange[i].val : 0);
          if(v !== null) sum += v;
        }
      });
      return sum;
    }
    case "NB.SI": case "COUNTIF": {
      const range = expandRangeRefs(args[0]);
      if(!range) throw new Error("#REF!");
      const crit = evaluated[1];
      let count = 0;
      range.forEach(function(cell){ if(matchCriteria(cell.val, crit)) count++ });
      return count;
    }
    case "AUJOURDHUI": case "TODAY": {
      const d = new Date();
      return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
    }
    default: throw new Error("#NOM?");
  }
}

function matchCriteria(val, crit){
  if(typeof crit === "number") return compare(val, crit) === 0;
  const s = str(crit);
  if(s.charAt(0) === ">" || s.charAt(0) === "<" || s.charAt(0) === "="){
    return applyOp(s.charAt(0), val, s.slice(1));
  }
  return compare(val, crit) === 0;
}

function num(v){
  if(typeof v === "number") return v;
  if(typeof v === "boolean") return v ? 1 : 0;
  if(v === "" || v == null) return 0;
  const n = parseFloat(String(v).replace(",","."));
  return isNaN(n) ? 0 : n;
}
function numOrNull(v){
  if(typeof v === "number") return v;
  if(typeof v === "boolean") return v ? 1 : 0;
  if(v === "" || v == null) return null;
  const n = parseFloat(String(v).replace(",","."));
  return isNaN(n) ? null : n;
}
function str(v){
  if(v == null || v === "") return "";
  if(typeof v === "number") return String(Math.round(v * 1e10) / 1e10);
  if(typeof v === "boolean") return v ? "VRAI" : "FAUX";
  if(Array.isArray(v)) return "#VALEUR!";
  return String(v);
}
function truthy(v){
  if(typeof v === "boolean") return v;
  if(typeof v === "number") return v !== 0;
  if(v === "" || v == null) return false;
  const s = String(v).toUpperCase();
  if(s === "VRAI" || s === "TRUE") return true;
  if(s === "FAUX" || s === "FALSE") return false;
  return true;
}
function compare(a, b){
  const na = numOrNull(a), nb = numOrNull(b);
  if(na !== null && nb !== null) return na < nb ? -1 : na > nb ? 1 : 0;
  const sa = str(a).toLowerCase(), sb = str(b).toLowerCase();
  return sa < sb ? -1 : sa > sb ? 1 : 0;
}

/* ============================================================
   GRILLE
   ============================================================ */
const table = document.getElementById("grid");
const gridWrap = document.getElementById("gridWrap");
let renderedVirtualWindow = null;
let pendingVirtualRenderFrame = null;

function getVirtualWindow(){
  const isParamSheet = activeSheet().type === "parametres";
  const dataStart = isParamSheet ? 0 : 1;
  const filteredRows = isFilterableSheet(activeSheet()) ? getFilteredRows() : null;
  const dataRows = filteredRows ? filteredRows.length : Math.max(0, ROWS - dataStart);
  const fixedHeight = VIRTUAL_ROW_HEIGHT * (isParamSheet ? 1 : 2);
  const rowScale = Math.min(VIRTUAL_ROW_HEIGHT, Math.max(1, (VIRTUAL_MAX_HEIGHT - fixedHeight) / Math.max(1, dataRows)));
  const visibleRows = Math.ceil((gridWrap.clientHeight || 600) / VIRTUAL_ROW_HEIGHT);
  const rowCount = Math.min(dataRows, Math.max(60, visibleRows + VIRTUAL_OVERSCAN_ROWS * 2));
  const maxStart = Math.max(0, dataRows - rowCount);
  const logicalOffset = Math.max(0, gridWrap.scrollTop - fixedHeight);
  const offset = Math.min(maxStart, Math.floor(logicalOffset / rowScale));

  if(filteredRows){
    return {
      isFiltered: true,
      dataStart,
      rows: filteredRows.slice(offset, offset + rowCount),
      rowOffset: offset,
      rowScale,
      topHeight: offset * rowScale,
      bottomHeight: Math.max(0, (filteredRows.length - offset - rowCount) * rowScale),
      fixedHeight,
      totalFiltered: filteredRows.length
    };
  }
  const start = dataStart + offset;
  return {
    isFiltered: false,
    dataStart,
    rows: null,
    start,
    end: Math.min(ROWS, start + rowCount),
    rowScale,
    topHeight: offset * rowScale,
    bottomHeight: Math.max(0, (ROWS - Math.min(ROWS, start + rowCount)) * rowScale),
    fixedHeight
  };
}

function sameVirtualWindow(a, b){
  if(!a || !b) return false;
  if(a.isFiltered !== b.isFiltered) return false;
  if(a.isFiltered){
    if(!a.rows || !b.rows) return false;
    if(a.rows.length !== b.rows.length) return false;
    for(let i = 0; i < a.rows.length; i++){
      if(a.rows[i] !== b.rows[i]) return false;
    }
    return true;
  }
  return a.start === b.start && a.end === b.end;
}

function scheduleVirtualRender(){
  if(pendingVirtualRenderFrame) return;
  pendingVirtualRenderFrame = window.requestAnimationFrame(function(){
    pendingVirtualRenderFrame = null;
    if(editingRef) return;
    const nextWindow = getVirtualWindow();
    if(!sameVirtualWindow(renderedVirtualWindow, nextWindow)){
      buildGrid();
      render();
    }
  });
}

gridWrap.addEventListener("scroll", function(){
  if(activeDropdownCell) closeDropdown();
  closeFilterMenu();
  if(editingRef){
    const editingCell = table.querySelector('td[data-ref="' + editingRef + '"]');
    const cellRect = editingCell && editingCell.getBoundingClientRect();
    const wrapRect = gridWrap.getBoundingClientRect();
    if(cellRect && cellRect.bottom >= wrapRect.top && cellRect.top <= wrapRect.bottom) return;
    endEdit(true);
  }
  const nextWindow = getVirtualWindow();
  if(!sameVirtualWindow(renderedVirtualWindow, nextWindow)){
    buildGrid();
    render();
  }
}, {passive: true});
window.addEventListener("resize", scheduleVirtualRender);

function buildGrid(){
  if(activeDropdownCell) closeDropdown();
  closeFilterMenu();
  if(!isSheetVisible(activeSheet(), activeSheet().type === "colonne" ? activeOwnerFilter : undefined)){
    const body = document.createElement("tbody");
    const row = document.createElement("tr");
    const message = document.createElement("td");
    message.colSpan = Math.max(1, COLS + 1);
    message.textContent = "Cette feuille n’est pas accessible ou les droits d’accès ne sont pas disponibles.";
    message.style.cssText = "padding:24px;text-align:center;color:#667085;";
    row.appendChild(message);
    body.appendChild(row);
    table.replaceChildren(body);
    gridWrap.scrollTop = 0;
    return;
  }
  const previousScrollTop = gridWrap.scrollTop;
  const isParamSheet = activeSheet().type === "parametres";
  const virtualWindow = getVirtualWindow();
  renderedVirtualWindow = virtualWindow;
  while(table.firstChild) table.removeChild(table.firstChild);

  const thead = document.createElement("thead");
  const trHead = document.createElement("tr");
  const corner = document.createElement("th");
  corner.id = "cornerCell";
  corner.title = "Tout sélectionner";
  trHead.appendChild(corner);

  for(let c=0; c<COLS; c++){
    const th = document.createElement("th");
    th.dataset.col = c;
    th.textContent = colName(c);
    const w = (!isParamSheet && currentHeaders[c] && currentHeaders[c].width)
              ? currentHeaders[c].width + "px" : "110px";
    th.style.width = w;
    th.style.minWidth = w;
    trHead.appendChild(th);
  }
  thead.appendChild(trHead);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  if(!isParamSheet){
    const trNames = document.createElement("tr");
    trNames.dataset.row = 0;
    const thName = document.createElement("th");
    thName.textContent = "1";
    thName.dataset.row = 0;
    trNames.appendChild(thName);

    for(let c=0; c<COLS; c++){
      const td = document.createElement("td");
      td.dataset.ref = refName(c, 0);
      td.dataset.row = 0;
      td.dataset.col = c;
      if(currentHeaders[c]){
        td.textContent = currentHeaders[c].header;
        const w = (currentHeaders[c].width || 130) + "px";
        td.style.width = w;
        td.style.minWidth = w;
        if(currentHeaders[c].type === "auto"){
          td.style.background = "#fff9c4";
          td.style.color = "#7b5c00";
        } else if(currentHeaders[c].type === "dropdown"){
          td.style.background = "#e3f2fd";
        }
        const icon = document.createElement("span");
        icon.className = "filter-icon";
        icon.textContent = "▼";
        icon.title = "Filtrer";
        icon.addEventListener("mousedown", function(ev){ev.stopPropagation();ev.preventDefault()});
        icon.addEventListener("click", function(ev){
          ev.stopPropagation(); ev.preventDefault();
          openFilterMenu(c, td);
        });
        td.appendChild(icon);
      } else {
        td.style.width = "110px";
        td.style.minWidth = "110px";
      }
      trNames.appendChild(td);
    }
    tbody.appendChild(trNames);
  }

  if(virtualWindow.topHeight > 0) appendVirtualSpacer(tbody, virtualWindow.topHeight);

  const rowsToRender = virtualWindow.isFiltered
    ? virtualWindow.rows
    : Array.from({length: virtualWindow.end - virtualWindow.start}, (_, i) => virtualWindow.start + i);

  for(let visibleRowIndex = 0; visibleRowIndex < rowsToRender.length; visibleRowIndex++){
    const r = rowsToRender[visibleRowIndex];
    const tr = document.createElement("tr");
    tr.dataset.row = r;
    const th = document.createElement("th");
    th.textContent = virtualWindow.isFiltered
      ? String(virtualWindow.rowOffset + visibleRowIndex + 2)
      : String(r + 1);
    th.dataset.row = r;
    tr.appendChild(th);
    for(let c=0; c<COLS; c++){
      const td = document.createElement("td");
      td.dataset.ref = refName(c, r);
      td.dataset.row = r;
      td.dataset.col = c;
      const w = (!isParamSheet && currentHeaders[c] && currentHeaders[c].width)
                ? currentHeaders[c].width + "px" : "110px";
      td.style.width = w;
      td.style.minWidth = w;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  if(virtualWindow.bottomHeight > 0) appendVirtualSpacer(tbody, virtualWindow.bottomHeight);
  table.appendChild(tbody);
  applyCellTypes();
  if(!isParamSheet) applyFilters();

  if(previousScrollTop > 0) gridWrap.scrollTop = previousScrollTop;
}

function appendVirtualSpacer(tbody, height){
  const row = document.createElement("tr");
  row.className = "virtual-spacer";
  row.setAttribute("aria-hidden", "true");
  const cell = document.createElement("td");
  cell.colSpan = COLS + 1;
  cell.style.cssText = "height:" + height + "px;padding:0;border:0;font-size:0;line-height:0;";
  row.appendChild(cell);
  tbody.appendChild(row);
}

function applyCellTypes(){
  if(activeSheet().type === "parametres") return;
  const tds = table.querySelectorAll("td");
  for(let i=0; i<tds.length; i++){
    const td = tds[i];
    const p = parseRef(td.dataset.ref);
    if(!p || p.r === 0) continue;
    const cfg = currentHeaders[p.c];
    if(!cfg) continue;
    if(cfg.type === "dropdown") td.classList.add("has-dropdown");
    else if(cfg.type === "auto"){
      td.classList.add("auto-calc");
      td.style.cursor = "not-allowed";
    }
  }
}

/* ============================================================
   RENDU
   ============================================================ */
function render(){
  if(!isSheetVisible(activeSheet(), activeSheet().type === "colonne" ? activeOwnerFilter : undefined)){
    buildGrid();
    return;
  }
  updateHighlightedRefs();

  const tds = table.querySelectorAll("td");
  const r = rect();
  let statusFormulaAdded = false;
  if(isDataSheet(activeSheet())){
    const apiColumns = getApiColumns(activeSheet());
    const visitedRows = new Set();
    for(let i = 0; i < tds.length; i++){
      const position = parseRef(tds[i].dataset.ref);
      if(!position || position.r === 0 || visitedRows.has(position.r)) continue;
      visitedRows.add(position.r);
      if(ensureBudgetStatusFormula(activeSheet(), position.r, apiColumns)) statusFormulaAdded = true;
    }
  }
  if(statusFormulaAdded){
    invalidateAll();
    saveLocal();
  }

  for(let i=0; i<tds.length; i++){
    const td = tds[i];
    const ref = td.dataset.ref;
    const p = parseRef(ref);
    if(!p) continue;
    const isHeaderRow = (p.r === 0 && isDataSheet(activeSheet()));
    const hasDropdownOpen = td.classList.contains("dropdown-open");
    const hasFilterOpen = td.classList.contains("filter-open");

    /* ✅ Ne pas écraser le contenu si un dropdown ou filtre est ouvert dans cette cellule,
       et ne pas écraser pendant l'édition */
    if(!isHeaderRow && ref !== editingRef && !hasDropdownOpen && !hasFilterOpen){
      const v = evaluate(ref);
      const txt = currentHeaders[p.c]?.header === "Écart (%)" && typeof v === "number"
        ? `${(v * 100).toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2})} %`
        : str(v);
      const hasMenuChild = td.querySelector(":scope > #dropdownMenu") || td.querySelector(":scope > #filterMenu");
      if(!hasMenuChild){
        if(td.textContent !== txt) td.textContent = txt;
      }
      if(typeof v === "number") td.classList.add("num");
      else td.classList.remove("num");
      if(typeof v === "string" && v.length > 0 && v.charAt(0) === "#") td.classList.add("err");
      else td.classList.remove("err");
    }

    const inRange = p.r >= r.r1 && p.r <= r.r2 && p.c >= r.c1 && p.c <= r.c2;
    td.classList.toggle("sel", inRange && ref !== currentRef && ref !== editingRef);
    td.classList.toggle("active", ref === currentRef && ref !== editingRef);
    td.classList.toggle("edit", ref === editingRef);
    td.classList.toggle("cut", !!clipboard && clipboard.mode === "cut" && isInClipboard(ref));
    td.classList.toggle("multi-selected", multiSelected.has(ref) && ref !== currentRef && ref !== editingRef);

    if(!isHeaderRow && highlightedRefs.has(ref) && ref !== currentRef && ref !== editingRef){
      td.classList.add("formula-ref");
    } else {
      td.classList.remove("formula-ref");
    }

    const inRow = selectedRows.has(p.r);
    const inCol = selectedCols.has(p.c);
    td.classList.toggle("row-selected", inRow && !inCol && !selectAllActive);
    td.classList.toggle("col-selected", inCol && !inRow && !selectAllActive);
    td.classList.toggle("all-selected", selectAllActive);

    const cell = cells.get(ref);
    const st = cell && cell.s ? cell.s : {};
    if(!isHeaderRow){
      td.style.fontWeight = st.b ? "bold" : "";
      td.style.fontStyle = st.i ? "italic" : "";
      td.style.textDecoration = st.u ? "underline" : "";
      if(td.classList.contains("auto-calc")){
        td.style.backgroundColor = "";
      } else if(st.bg){
        td.style.backgroundColor = st.bg;
      } else {
        td.style.backgroundColor = "";
      }
    }
  }

  table.querySelectorAll("thead th[data-col]").forEach(function(th){
    const c = parseInt(th.dataset.col, 10);
    th.classList.toggle("selected", selectedCols.has(c) || selectAllActive);
  });
  table.querySelectorAll("tbody th[data-row]").forEach(function(th){
    const r2 = parseInt(th.dataset.row, 10);
    th.classList.toggle("selected", selectedRows.has(r2) || selectAllActive);
  });
  const corner = document.getElementById("cornerCell");
  if(corner) corner.classList.toggle("selected", selectAllActive);

  document.getElementById("cellRef").textContent = currentRef;
  const currentCell = cells.get(currentRef);
  const rawVal = currentCell && currentCell.v != null ? String(currentCell.v) : "";
  const fi2 = document.getElementById("formulaInput");
  if(document.activeElement !== fi2 && editingRef !== currentRef && !formulaInsertMode){
    fi2.value = rawVal;
  }
  if(isProtectedCell(currentRef)){
    fi2.readOnly = true;
    fi2.title = "🔒 Colonne calculée automatiquement : lecture seule";
  } else {
    fi2.readOnly = false;
    fi2.title = "";
  }

  syncToolbarState();
  updateStatus();
  updateFillHandle();
  if(isFilterableSheet(activeSheet())) applyFilters();
}

function isInClipboard(ref){
  if(!clipboard) return false;
  const p = parseRef(ref);
  return p.r >= clipboard.srcTop && p.r < clipboard.srcTop + clipboard.h &&
         p.c >= clipboard.srcLeft && p.c < clipboard.srcLeft + clipboard.w;
}

function rect(){
  const a = parseRef(selectedAnchor);
  const f = parseRef(currentRef);
  return {
    r1: Math.min(a.r, f.r), r2: Math.max(a.r, f.r),
    c1: Math.min(a.c, f.c), c2: Math.max(a.c, f.c)
  };
}

function getSelectedCells(limit = Infinity){
  if(limit === Infinity){
    const selection = rect();
    const estimatedSize = selectAllActive
      ? ROWS * COLS
      : selectedRows.size && selectedCols.size
        ? selectedRows.size * selectedCols.size
        : selectedRows.size
          ? selectedRows.size * COLS
          : selectedCols.size
            ? selectedCols.size * ROWS
            : (selection.r2 - selection.r1 + 1) * (selection.c2 - selection.c1 + 1) + multiSelected.size;
    if(estimatedSize > 100000){
      showToast("Sélection trop grande pour cette opération");
      return [];
    }
  }
  const result = [];
  const seen = new Set();
  function add(c, r){
    if(result.length >= limit) return;
    const ref = refName(c, r);
    if(!seen.has(ref)){ seen.add(ref); result.push({r:r, c:c, ref:ref}) }
  }

  if(selectAllActive){
    for(let r=0; r<ROWS && result.length < limit; r++)
      for(let c=0; c<COLS && result.length < limit; c++) add(c, r);
    return result;
  }
  if(selectedRows.size > 0 && selectedCols.size > 0){
    selectedRows.forEach(function(r){
      selectedCols.forEach(function(c){ if(result.length < limit) add(c, r) });
    });
    return result;
  }
  if(selectedRows.size > 0){
    selectedRows.forEach(function(r){
      for(let c=0; c<COLS && result.length < limit; c++) add(c, r);
    });
    return result;
  }
  if(selectedCols.size > 0){
    selectedCols.forEach(function(c){
      for(let r=0; r<ROWS && result.length < limit; r++) add(c, r);
    });
    return result;
  }
  const rec = rect();
  for(let r=rec.r1; r<=rec.r2; r++)
    for(let c=rec.c1; c<=rec.c2; c++) add(c, r);

  multiSelected.forEach(function(ref){
    const p = parseRef(ref);
    if(p) add(p.c, p.r);
  });

  return result;
}

function updateStatus(){
  let sum = 0, count = 0;
  const sel = getSelectedCells(5000);
  for(let i=0; i<sel.length; i++){
    const v = evaluate(sel[i].ref);
    if(typeof v === "number" && isFinite(v)){ sum += v; count++ }
  }
  const stSumEl = document.getElementById("stSum");
  const stCountEl = document.getElementById("stCount");
  const stAvgEl = document.getElementById("stAvg");
  if(count){
    stSumEl.textContent = formatNumber(sum); stSumEl.classList.remove("muted");
    stCountEl.textContent = count; stCountEl.classList.remove("muted");
    stAvgEl.textContent = formatNumber(sum / count); stAvgEl.classList.remove("muted");
  } else {
    stSumEl.textContent = "—"; stSumEl.classList.add("muted");
    stCountEl.textContent = "—"; stCountEl.classList.add("muted");
    stAvgEl.textContent = "—"; stAvgEl.classList.add("muted");
  }
}
function formatNumber(n){
  return (Math.round(n * 100) / 100).toLocaleString("fr-FR", {maximumFractionDigits: 2});
}
function syncToolbarState(){
  const btnUndo = document.getElementById("btnUndo");
  const btnRedo = document.getElementById("btnRedo");
  if(btnUndo) btnUndo.disabled = undoStack.length === 0;
  if(btnRedo) btnRedo.disabled = redoStack.length === 0;
}
function invalidateAll(){
  valueCache = new Map();
  populatedCoordinateIndex = null;
  ownerRowsIndexCache = null;
  invalidateFilteredRowsCache();
}

function updateFillHandle(){
  table.querySelectorAll(".fill-handle").forEach(function(h){ h.remove() });
  if(editingRef) return;
  if(selectAllActive || selectedRows.size || selectedCols.size) return;
  if(isProtectedCell(currentRef)) return;
  const td = table.querySelector('td[data-ref="' + currentRef + '"]');
  if(!td) return;
  const handle = document.createElement("div");
  handle.className = "fill-handle";
  handle.addEventListener("mousedown", function(e){ e.stopPropagation(); e.preventDefault(); startFillDrag(e); });
  handle.addEventListener("dblclick", function(e){ e.stopPropagation(); e.preventDefault(); fillDownAuto(); });
  td.appendChild(handle);
}

function fillDownAuto(){
  const rec = rect();
  let lastRow = rec.r2;
  const storedRows = new Set();
  cells.forEach(function(cell, ref){
    const position = parseRef(ref);
    if(position && position.r > rec.r2 && position.r < ROWS && cell?.v != null && cell.v !== "") storedRows.add(position.r);
  });
  while(storedRows.has(lastRow + 1)) lastRow++;
  if(lastRow <= rec.r2){ showToast("Rien à recopier"); return; }
  pushUndo();
  const srcH = rec.r2 - rec.r1 + 1;
  for(let r = rec.r2 + 1; r <= lastRow; r++){
    const srcRowOffset = (r - rec.r1) % srcH;
    for(let c = rec.c1; c <= rec.c2; c++){
      const targetRef = refName(c, r);
      if(isProtectedCell(targetRef)) continue;
      const srcCell = cells.get(refName(c, rec.r1 + srcRowOffset));
      if(!srcCell){ cells.delete(targetRef); continue }
      const newCell = JSON.parse(JSON.stringify(srcCell));
      if(newCell.v && String(newCell.v).charAt(0) === "=")
        newCell.v = shiftFormula(String(newCell.v), r - (rec.r1 + srcRowOffset), 0);
      cells.set(targetRef, newCell);
    }
  }
  invalidateAll(); saveLocal(); render();
  showToast("📋 Recopié vers le bas");
}

function scrollToRef(ref){
  let td = table.querySelector('td[data-ref="' + ref + '"]');
  if(!td){
    const position = parseRef(ref);
    const virtualWindow = getVirtualWindow();
    if(position && position.r >= 0 && position.r < ROWS){
      let rowOffset;
      if(virtualWindow.isFiltered){
        rowOffset = getFilteredRows().indexOf(position.r);
        if(rowOffset < 0) return;
      } else {
        rowOffset = position.r - virtualWindow.dataStart;
      }
      gridWrap.scrollTop = virtualWindow.fixedHeight + Math.max(0, rowOffset) * virtualWindow.rowScale;
      buildGrid();
      render();
      scrollToRef(ref);
      return;
    }
  }
  if(!td) return;
  const wrapRect = gridWrap.getBoundingClientRect();
  const cellRect = td.getBoundingClientRect();
  const position = parseRef(ref);
  const topInset = position && position.r === 0 && activeSheet().type !== "parametres"
    ? VIRTUAL_ROW_HEIGHT
    : (activeSheet().type === "parametres" ? VIRTUAL_ROW_HEIGHT : VIRTUAL_ROW_HEIGHT * 2);
  const leftInset = 44;
  let nextScrollTop = gridWrap.scrollTop;
  let nextScrollLeft = gridWrap.scrollLeft;

  if(cellRect.top < wrapRect.top + topInset){
    nextScrollTop += cellRect.top - (wrapRect.top + topInset);
  } else if(cellRect.bottom > wrapRect.bottom){
    nextScrollTop += cellRect.bottom - wrapRect.bottom;
  }
  if(cellRect.left < wrapRect.left + leftInset){
    nextScrollLeft += cellRect.left - (wrapRect.left + leftInset);
  } else if(cellRect.right > wrapRect.right){
    nextScrollLeft += cellRect.right - wrapRect.right;
  }

  if(nextScrollTop !== gridWrap.scrollTop) gridWrap.scrollTop = Math.max(0, nextScrollTop);
  if(nextScrollLeft !== gridWrap.scrollLeft) gridWrap.scrollLeft = Math.max(0, nextScrollLeft);
}

function setCurrent(ref){
  if(editingRef && editingRef !== ref) endEdit(true);
  selectedRows.clear(); selectedCols.clear(); selectAllActive = false;
  selectedRowAnchor = null;
  multiSelected.clear();
  const position = parseRef(cleanRef(ref));
  if(!position){ showToast("Référence de cellule invalide"); return; }
  position.c = Math.max(0, Math.min(COLS - 1, position.c));
  position.r = Math.max(0, Math.min(ROWS - 1, position.r));
  currentRef = refName(position.c, position.r);
  selectedAnchor = currentRef;
  render();
  scrollToRef(currentRef);
}

function move(dc, dr, extend){
  if(editingRef) endEdit(true);
  if(!extend){
    selectedRows.clear(); selectedCols.clear(); selectAllActive = false;
    selectedRowAnchor = null;
  }
  const p = parseRef(currentRef);
  const nc = Math.max(0, Math.min(COLS - 1, p.c + dc));
  const nr = Math.max(0, Math.min(ROWS - 1, p.r + dr));
  currentRef = refName(nc, nr);
  if(!extend){ selectedAnchor = currentRef; multiSelected.clear(); }
  render();
  scrollToRef(currentRef);
}

function moveByVisibleRows(delta, extend){
  if(!isFilterableSheet(activeSheet())){
    move(0, delta, extend);
    return;
  }
  const position = parseRef(currentRef);
  const visibleRows = getFilteredRows();
  if(!position || !visibleRows.length) return;

  let targetIndex;
  if(position.r === 0 && delta > 0){
    targetIndex = 0;
  } else {
    const currentIndex = visibleRows.indexOf(position.r);
    if(currentIndex >= 0){
      targetIndex = Math.max(0, Math.min(visibleRows.length - 1, currentIndex + delta));
    } else if(delta > 0){
      targetIndex = lowerBound(visibleRows, position.r);
      if(targetIndex >= visibleRows.length) targetIndex = visibleRows.length - 1;
    } else {
      targetIndex = lowerBound(visibleRows, position.r) - 1;
      if(targetIndex < 0) targetIndex = 0;
    }
  }

  move(0, visibleRows[targetIndex] - position.r, extend);
}

function moveToEdge(dc, dr, extend){
  if(editingRef) endEdit(true);
  if(!extend){
    selectedRows.clear(); selectedCols.clear(); selectAllActive = false; multiSelected.clear();
  }
  let p = parseRef(currentRef);
  let c = p.c, r = p.r;
  const vertical = dr !== 0;
  const coordinate = vertical ? r : c;
  const step = vertical ? dr : dc;
  const boundary = step > 0 ? (vertical ? ROWS - 1 : COLS - 1) : 0;
  const candidates = getPopulatedCoordinatesOnAxis(c, r, vertical);
  const hasValueAt = candidate => {
    const value = evaluate(refName(vertical ? c : candidate, vertical ? candidate : r));
    return value !== "" && value != null;
  };
  const findNextValue = start => {
    let index = step > 0 ? lowerBound(candidates, start) : lowerBound(candidates, start + 1) - 1;
    for(; index >= 0 && index < candidates.length; index += step > 0 ? 1 : -1){
      const candidate = candidates[index];
      if((step > 0 && candidate > boundary) || (step < 0 && candidate < boundary)) break;
      if(hasValueAt(candidate)) return { candidate, index };
    }
    return null;
  };
  const currentValue = evaluate(refName(c, r));
  const currentHasValue = currentValue !== "" && currentValue != null;
  const adjacent = coordinate + step;
  let target = boundary;

  if(currentHasValue && adjacent >= 0 && adjacent <= (vertical ? ROWS - 1 : COLS - 1)){
    if(hasValueAt(adjacent)){
      target = adjacent;
      let next = findNextValue(target + step);
      while(next && next.candidate === target + step){
        target = next.candidate;
        next = findNextValue(target + step);
      }
    } else if(findNextValue(adjacent + step)){
      target = adjacent;
    }
  } else if(!currentHasValue){
    const next = findNextValue(adjacent);
    if(next) target = next.candidate;
  }

  if(vertical) r = target;
  else c = target;
  if(vertical && r !== 0 && isFilterableSheet(activeSheet())){
    const visibleRows = getFilteredRows();
    if(visibleRows.length && !visibleRows.includes(r)){
      const index = step > 0 ? lowerBound(visibleRows, r) : lowerBound(visibleRows, r + 1) - 1;
      r = index >= 0 && index < visibleRows.length
        ? visibleRows[index]
        : (step > 0 ? visibleRows[visibleRows.length - 1] : visibleRows[0]);
    }
  }
  currentRef = refName(c, r);
  if(!extend) selectedAnchor = currentRef;
  render();
  scrollToRef(currentRef);
}

function extendSelectedRows(delta){
  if(!selectedRows.size) return false;
  const position = parseRef(currentRef);
  if(!position) return false;
  if(selectedRowAnchor === null) selectedRowAnchor = position.r;
  const row = Math.max(1, Math.min(ROWS - 1, position.r + delta));
  selectedRows.clear();
  for(let current = Math.min(selectedRowAnchor, row); current <= Math.max(selectedRowAnchor, row); current++){
    selectedRows.add(current);
  }
  currentRef = refName(position.c, row);
  selectedCols.clear(); selectAllActive = false; multiSelected.clear();
  render();
  scrollToRef(currentRef);
  return true;
}

function lowerBound(values, target){
  let low = 0, high = values.length;
  while(low < high){
    const middle = (low + high) >> 1;
    if(values[middle] < target) low = middle + 1;
    else high = middle;
  }
  return low;
}

function getPopulatedCoordinatesOnAxis(col, row, vertical){
  if(!populatedCoordinateIndex){
    const rows = new Map(), columns = new Map();
    cells.forEach(function(cell, ref){
      if(!cell || cell.v === undefined || cell.v === null || cell.v === "") return;
      const position = parseRef(ref);
      if(!position) return;
      if(!rows.has(position.r)) rows.set(position.r, []);
      if(!columns.has(position.c)) columns.set(position.c, []);
      rows.get(position.r).push(position.c);
      columns.get(position.c).push(position.r);
    });
    rows.forEach(values => values.sort((a, b) => a - b));
    columns.forEach(values => values.sort((a, b) => a - b));
    populatedCoordinateIndex = {rows, columns};
  }
  const coordinates = vertical ? populatedCoordinateIndex.columns.get(col) : populatedCoordinateIndex.rows.get(row);
  return coordinates || [];
}

   ============================================================ */
function snapshot(){
  return {
    sheetIdx: activeSheetIdx,
    pendingServerDeletes: new Set(pendingServerDeletes),
    sheets: sheets.map(function(s){
      return {
        id: s.id, name: s.name, color: s.color, type: s.type, headers: s.headers,
        rows: s.rows, cells: new Map(s.cells), filters: new Map(s.filters)
      };
    }),
    currentRef: currentRef, selectedAnchor: selectedAnchor,
    selectedRows: new Set(selectedRows), selectedCols: new Set(selectedCols),
    selectAllActive: selectAllActive,
    multiSelected: new Set(multiSelected)
  };
}
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length > 100) undoStack.shift();
  redoStack = [];
  saveLocal();
  syncToolbarState();
}
function restoreSnapshot(s){
  sheets = s.sheets;
  activeSheetIdx = s.sheetIdx;
  pendingServerDeletes = new Set(s.pendingServerDeletes || []);
  currentRef = s.currentRef;
  selectedAnchor = s.selectedAnchor;
  selectedRows = new Set(s.selectedRows);
  selectedCols = new Set(s.selectedCols);
  selectAllActive = s.selectAllActive;
  multiSelected = new Set(s.multiSelected || []);
  syncActiveSheetRefs();
  invalidateAll();
  buildGrid();
  renderSheetTabs();
  render();
  syncToolbarState();
  reconcilePendingServerDeletes();
  saveLocal();
}
function undo(){
  if(editingRef) endEdit(true);
  if(!undoStack.length){ showToast("Rien à annuler"); return }
  redoStack.push(snapshot());
  restoreSnapshot(undoStack.pop());
  showToast("↶ Annulé");
}
function redo(){
  if(editingRef) endEdit(true);
  if(!redoStack.length){ showToast("Rien à rétablir"); return }
  undoStack.push(snapshot());
  restoreSnapshot(redoStack.pop());
  showToast("↷ Rétabli");
}

/* ============================================================
   INSERTION / SUPPRESSION DE LIGNES
   ============================================================ */
function shiftAllFormulasForRowInsert(cellsMap, insertAt, count){
  const newCells = new Map();
  cellsMap.forEach(function(cell, ref){
    if(cell.v && String(cell.v).charAt(0) === "="){
      let f = String(cell.v);
      f = f.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, function(match, absCol, col, absRow, row){
        let r = parseInt(row,10)-1;
        if(!absRow && r >= insertAt) r += count;
        return absCol + col + absRow + (r+1);
      });
      cell = Object.assign({}, cell, {v: f});
    }
    newCells.set(ref, cell);
  });
  return newCells;
}
function shiftAllFormulasForRowDelete(cellsMap, deleteStart, deleteCount){
  const newCells = new Map();
  cellsMap.forEach(function(cell, ref){
    if(cell.v && String(cell.v).charAt(0) === "="){
      let f = String(cell.v);
      f = f.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, function(match, absCol, col, absRow, row){
        let r = parseInt(row,10)-1;
        if(!absRow && r >= deleteStart + deleteCount) r -= deleteCount;
        else if(!absRow && r >= deleteStart && r < deleteStart + deleteCount) return "#REF!";
        return absCol + col + absRow + (r+1);
      });
      cell = Object.assign({}, cell, {v: f});
    }
    newCells.set(ref, cell);
  });
  return newCells;
}
function shiftAllFormulasForColInsert(cellsMap, insertAt, count){
  const newCells = new Map();
  cellsMap.forEach(function(cell, ref){
    if(cell.v && String(cell.v).charAt(0) === "="){
      let f = String(cell.v);
      f = f.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, function(match, absCol, col, absRow, row){
        let c = colIndex(col);
        if(!absCol && c >= insertAt) c += count;
        return absCol + colName(c) + absRow + row;
      });
      cell = Object.assign({}, cell, {v: f});
    }
    newCells.set(ref, cell);
  });
  return newCells;
}
function shiftAllFormulasForColDelete(cellsMap, deleteStart, deleteCount){
  const newCells = new Map();
  cellsMap.forEach(function(cell, ref){
    if(cell.v && String(cell.v).charAt(0) === "="){
      let f = String(cell.v);
      f = f.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, function(match, absCol, col, absRow, row){
        let c = colIndex(col);
        if(!absCol && c >= deleteStart + deleteCount) c -= deleteCount;
        else if(!absCol && c >= deleteStart && c < deleteStart + deleteCount) return "#REF!";
        return absCol + colName(c) + absRow + row;
      });
      cell = Object.assign({}, cell, {v: f});
    }
    newCells.set(ref, cell);
  });
  return newCells;
}

function insertRow(atIndex, count){
  count = count || 1;
  atIndex = Math.max(1, atIndex);
  count = Math.min(count, Math.max(0, EXCEL_MAX_ROWS - atIndex));
  if(count === 0){ showToast("Limite de 1 000 000 lignes atteinte"); return; }
  pushUndo();
  let workingCells = shiftAllFormulasForRowInsert(cells, atIndex, count);
  const newCells = new Map();
  workingCells.forEach(function(cell, ref){
    const p = parseRef(ref);
    if(p.r < atIndex) newCells.set(ref, cell);
    else if(p.r + count < EXCEL_MAX_ROWS) newCells.set(refName(p.c, p.r + count), cell);
  });
  activeSheet().cells = newCells;
  activeSheet().rows = Math.min(EXCEL_MAX_ROWS, (activeSheet().rows || ROWS) + count);
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); buildGrid(); render();
  showToast("➕ " + count + " ligne(s) insérée(s)");
}

function deleteRow(atIndex, count){
  count = count || 1;
  atIndex = Math.max(1, atIndex);
  count = Math.min(count, Math.max(0, ROWS - atIndex));
  if(count === 0) return;
  pushUndo();
  if(isDataSheet(activeSheet())){
    const columns = getApiColumns(activeSheet());
    for(let row = atIndex; row < Math.min(atIndex + count, ROWS); row++){
      const serverId = getRowServerId(activeSheet(), row, columns);
      if(serverId) pendingServerDeletes.add(serverId);
    }
  }
  let workingCells = shiftAllFormulasForRowDelete(cells, atIndex, count);
  const newCells = new Map();
  workingCells.forEach(function(cell, ref){
    const p = parseRef(ref);
    if(p.r >= atIndex && p.r < atIndex + count) return;
    if(p.r >= atIndex + count) newCells.set(refName(p.c, p.r - count), cell);
    else newCells.set(ref, cell);
  });
  activeSheet().cells = newCells;
  activeSheet().rows = isDataSheet(activeSheet())
    ? EXCEL_MAX_ROWS
    : Math.max(20, (activeSheet().rows || ROWS) - count);
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); buildGrid(); render();
  showToast("➖ " + count + " ligne(s) supprimée(s)");
}

function insertCol(atIndex, count){
  count = count || 1;
  pushUndo();
  let workingCells = shiftAllFormulasForColInsert(cells, atIndex, count);
  const newCells = new Map();
  workingCells.forEach(function(cell, ref){
    const p = parseRef(ref);
    if(p.c >= atIndex) newCells.set(refName(p.c + count, p.r), cell);
    else newCells.set(ref, cell);
  });
  activeSheet().cells = newCells;
  if(Array.isArray(activeSheet().headers)){
    const newHeaders = activeSheet().headers.slice();
    for(let i = 0; i < count; i++){
      newHeaders.splice(atIndex + i, 0, { header: "", type: "text", width: 110 });
    }
    activeSheet().headers = newHeaders;
  }
  for(let c = 0; c < (activeSheet().headers || []).length; c++){
    const cfg = activeSheet().headers[c];
    if(!cfg || !cfg.header) continue;
    const ref = refName(c, 0);
    const cell = Object.assign({}, cells.get(ref) || {});
    cell.v = cfg.header;
    cells.set(ref, cell);
  }
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); buildGrid(); render();
  showToast("➕ " + count + " colonne(s) insérée(s)");
}

function deleteCol(atIndex, count){
  count = count || 1;
  pushUndo();
  let workingCells = shiftAllFormulasForColDelete(cells, atIndex, count);
  const newCells = new Map();
  workingCells.forEach(function(cell, ref){
    const p = parseRef(ref);
    if(p.c >= atIndex && p.c < atIndex + count) return;
    if(p.c >= atIndex + count) newCells.set(refName(p.c - count, p.r), cell);
    else newCells.set(ref, cell);
  });
  activeSheet().cells = newCells;
  if(Array.isArray(activeSheet().headers)){
    const newHeaders = activeSheet().headers.slice();
    newHeaders.splice(atIndex, count);
    activeSheet().headers = newHeaders;
  }
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); buildGrid(); render();
  showToast("➖ " + count + " colonne(s) supprimée(s)");
}

/* ============================================================
   TRI
   ============================================================ */
function sortColumn(colIdx, ascending){
  pushUndo();
  const storedRows = new Set();
  cells.forEach(function(cell, ref){
    const position = parseRef(ref);
    if(position && position.r > 0 && position.r < ROWS) storedRows.add(position.r);
  });
  const rowIndexes = Array.from(storedRows).sort((a, b) => a - b);
  const rowsData = rowIndexes.map(function(r){
    const rowCells = [];
    let isEmpty = true;
    for(let c = 0; c < COLS; c++){
      const cell = cells.get(refName(c, r));
      rowCells.push(cell ? JSON.parse(JSON.stringify(cell)) : null);
      if(cell && cell.v != null && cell.v !== "") isEmpty = false;
    }
    return {data: rowCells, empty: isEmpty, key: evaluate(refName(colIdx, r)), originalRow: r};
  });
  rowsData.sort(function(a, b){
    if(a.empty && !b.empty) return 1;
    if(!a.empty && b.empty) return -1;
    if(a.empty && b.empty) return 0;
    const cmp = compare(a.key, b.key);
    return ascending ? cmp : -cmp;
  });

  const rowRemap = new Map();
  rowsData.forEach(function(row, i){
    rowRemap.set(row.originalRow, rowIndexes[i]);
  });

  const newCells = new Map();
  for(let c = 0; c < COLS; c++){
    const cell = cells.get(refName(c, 0));
    if(cell) newCells.set(refName(c, 0), cell);
  }
  rowsData.forEach(function(row, i){
    const targetRow = rowIndexes[i];
    row.data.forEach(function(cell, c){
      if(!cell) return;
      const copy = JSON.parse(JSON.stringify(cell));
      if(copy.v && String(copy.v).charAt(0) === "="){
        copy.v = String(copy.v).replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, function(match, absCol, col, absRow, rowNum){
          const oldR = parseInt(rowNum, 10) - 1;
          if(absRow) return match;
          if(rowRemap.has(oldR)){
            return absCol + col + absRow + (rowRemap.get(oldR) + 1);
          }
          return match;
        });
      }
      newCells.set(refName(c, targetRow), copy);
    });
  });

  activeSheet().cells = newCells;
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); render();
  showToast(ascending ? "⬆ Tri croissant" : "⬇ Tri décroissant");
}

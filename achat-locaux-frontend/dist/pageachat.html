function startEdit(ref, initialText){
  if(editingRef) return;
  if(selectAllActive || selectedRows.size || selectedCols.size){
    showToast("Désélectionnez d'abord");
    return;
  }
  const p = parseRef(ref);
  if(isDataSheet(activeSheet())){
    if(p.r === 0){ showToast("🔒 Ligne d'en-tête : non modifiable"); return; }
    const cfg = currentHeaders[p.c];
    if(cfg && cfg.type === "auto"){ showToast("🔒 Colonne calculée automatiquement : non modifiable"); return; }
    /* ✅ Les colonnes dropdown sont maintenant éditables librement */
  }

  editingRef = ref;
  const td = table.querySelector('td[data-ref="' + ref + '"]');
  if(!td){ editingRef = null; return }
  const cell = cells.get(ref);
  const textVal = initialText !== undefined ? initialText : (cell && cell.v != null ? String(cell.v) : "");
  td.textContent = textVal;
  td.classList.add("edit");
  td.contentEditable = "true";
  td.focus();
  try{
    const rng = document.createRange();
    rng.selectNodeContents(td);
    rng.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(rng);
  }catch(e){}
  document.getElementById("formulaInput").value = textVal;

  const isFormula = textVal.charAt(0) === "=";
  formulaTyping = isFormula;
  formulaInsertMode = isFormula;
  formulaRangeStart = null;
  formulaInsertSource = "cellEdit";
  if(isFormula) document.getElementById("formulaHint").classList.add("show");
  else document.getElementById("formulaHint").classList.remove("show");

  td.addEventListener("input", handleCellEditInput);
}

function handleCellEditInput(e){
  const td = e.currentTarget;
  const val = td.textContent || "";
  const isFormula = val.charAt(0) === "=";
  formulaTyping = isFormula;
  formulaInsertMode = isFormula;
  if(!isFormula) formulaRangeStart = null;
  document.getElementById("formulaInput").value = val;
  if(isFormula) document.getElementById("formulaHint").classList.add("show");
  else document.getElementById("formulaHint").classList.remove("show");
}

function assignActiveOwnerToRow(row){
  if(activeSheet().type !== "colonne" || !IN_PROGRESS_OWNERS.some(owner => normalizeOwnerName(owner.name) === normalizeOwnerName(activeOwnerFilter))) return false;
  const ownerColumn = getApiColumns(activeSheet()).find(column => column.field === "acheteur");
  if(!ownerColumn) return false;
  const ref = refName(ownerColumn.col, row);
  const existingCell = cells.get(ref);
  if(existingCell && existingCell.v != null && String(existingCell.v).trim() !== "") return false;
  cells.set(ref, Object.assign({}, existingCell || {}, {v: activeOwnerFilter}));
  return true;
}

function endEdit(save){
  if(!editingRef) return;
  const ref = editingRef;
  editingRef = null;
  formulaTyping = false;
  formulaInsertMode = false;
  formulaRangeStart = null;
  formulaInsertSource = null;
  document.getElementById("formulaHint").classList.remove("show");

  const td = table.querySelector('td[data-ref="' + ref + '"]');
  if(!td) return;
  td.removeEventListener("input", handleCellEditInput);

  const newVal = (td.textContent || "").trim();
  td.classList.remove("edit");
  td.contentEditable = "false";
  let ownerAssigned = false;
  if(save){
    const oldCell = cells.get(ref);
    const oldVal = oldCell && oldCell.v != null ? String(oldCell.v) : "";
    if(newVal !== oldVal){
      pushUndo();
      const c = Object.assign({}, oldCell || {});
      if(newVal === "") delete c.v; else c.v = newVal;
      if(Object.keys(c).length === 0) cells.delete(ref);
      else cells.set(ref, c);
      const parsedRef = parseRef(ref);
      if(newVal !== "" && parsedRef) ownerAssigned = assignActiveOwnerToRow(parsedRef.r);
      if(activeSheet().type === "colonne" && parsedRef && parsedRef.r >= ROWS - OWNER_EMPTY_ROWS){
        syncActiveSheetRefs();
      }
      invalidateAll();
      if(parsedRef) queueServerDeleteForEmptyRow(parsedRef.r);
      saveLocal();
    }
  }
  if(ownerAssigned) renderSheetTabs();
  render();
}

/* ============================================================
   FILL HANDLE
   ============================================================ */
let fillDrag = null;
let fillPreviewTds = [];

function startFillDrag(e){
  if(editingRef) return;
  const r = rect();
  fillDrag = {r1:r.r1, r2:r.r2, c1:r.c1, c2:r.c2, dir:null, endR:r.r2, endC:r.c2};
  document.addEventListener("mousemove", onFillDragMove);
  document.addEventListener("mouseup", onFillDragEnd);
}

function onFillDragMove(e){
  if(!fillDrag) return;
  const td = document.elementFromPoint(e.clientX, e.clientY);
  const targetTd = td && td.closest ? td.closest("td") : null;
  if(!targetTd) return;
  const p = parseRef(targetTd.dataset.ref);
  if(!p) return;
  const dRow = p.r - fillDrag.r2;
  const dCol = p.c - fillDrag.c2;
  let dir = null;
  if(Math.abs(dRow) >= Math.abs(dCol)){
    if(dRow > 0) dir = "down";
    else if(dRow < 0 && p.r < fillDrag.r1) dir = "up";
  } else {
    if(dCol > 0) dir = "right";
    else if(dCol < 0 && p.c < fillDrag.c1) dir = "left";
  }
  clearFillPreview();
  if(!dir) return;
  fillDrag.dir = dir;
  if(dir === "down"){
    fillDrag.endR = Math.max(fillDrag.r2, p.r);
    for(let r = fillDrag.r2 + 1; r <= fillDrag.endR; r++)
      for(let c = fillDrag.c1; c <= fillDrag.c2; c++) addFillPreview(refName(c,r));
  } else if(dir === "up"){
    fillDrag.endR = Math.min(fillDrag.r1, p.r);
    for(let r = fillDrag.r1 - 1; r >= fillDrag.endR; r--)
      for(let c = fillDrag.c1; c <= fillDrag.c2; c++) addFillPreview(refName(c,r));
  } else if(dir === "right"){
    fillDrag.endC = Math.max(fillDrag.c2, p.c);
    for(let c = fillDrag.c2 + 1; c <= fillDrag.endC; c++)
      for(let r = fillDrag.r1; r <= fillDrag.r2; r++) addFillPreview(refName(c,r));
  } else if(dir === "left"){
    fillDrag.endC = Math.min(fillDrag.c1, p.c);
    for(let c = fillDrag.c1 - 1; c >= fillDrag.endC; c--)
      for(let r = fillDrag.r1; r <= fillDrag.r2; r++) addFillPreview(refName(c,r));
  }
}
function addFillPreview(ref){
  const td = table.querySelector('td[data-ref="' + ref + '"]');
  if(td){ td.classList.add("fill-preview"); fillPreviewTds.push(td) }
}
function clearFillPreview(){
  fillPreviewTds.forEach(function(td){ td.classList.remove("fill-preview") });
  fillPreviewTds = [];
}
function onFillDragEnd(e){
  document.removeEventListener("mousemove", onFillDragMove);
  document.removeEventListener("mouseup", onFillDragEnd);
  if(!fillDrag) return;
  const d = fillDrag;
  fillDrag = null;
  clearFillPreview();
  if(!d.dir) return;
  pushUndo();
  const srcR1 = d.r1, srcR2 = d.r2, srcC1 = d.c1, srcC2 = d.c2;
  const srcH = srcR2 - srcR1 + 1, srcW = srcC2 - srcC1 + 1;

  if(d.dir === "down"){
    for(let r = srcR2 + 1; r <= d.endR; r++){
      const srcRowOffset = (r - srcR1) % srcH;
      for(let c = srcC1; c <= srcC2; c++){
        const targetRef = refName(c, r);
        if(isProtectedCell(targetRef)) continue;
        const srcCell = cells.get(refName(c, srcR1 + srcRowOffset));
        if(!srcCell){ cells.delete(targetRef); continue }
        const newCell = clearServerMetadata(JSON.parse(JSON.stringify(srcCell)));
        if(newCell.v && String(newCell.v).charAt(0) === "=")
          newCell.v = shiftFormula(String(newCell.v), r - (srcR1 + srcRowOffset), 0);
        cells.set(targetRef, newCell);
      }
    }
  } else if(d.dir === "up"){
    for(let r = srcR1 - 1; r >= d.endR; r--){
      const srcRowOffset = (srcR1 - r) % srcH;
      const srcRow = srcR2 - srcRowOffset;
      for(let c = srcC1; c <= srcC2; c++){
        const targetRef = refName(c, r);
        if(isProtectedCell(targetRef)) continue;
        const srcCell = cells.get(refName(c, srcRow));
        if(!srcCell){ cells.delete(targetRef); continue }
        const newCell = clearServerMetadata(JSON.parse(JSON.stringify(srcCell)));
        if(newCell.v && String(newCell.v).charAt(0) === "=")
          newCell.v = shiftFormula(String(newCell.v), r - srcRow, 0);
        cells.set(targetRef, newCell);
      }
    }
  } else if(d.dir === "right"){
    for(let c = srcC2 + 1; c <= d.endC; c++){
      const srcColOffset = (c - srcC1) % srcW;
      for(let r = srcR1; r <= srcR2; r++){
        const targetRef = refName(c, r);
        if(isProtectedCell(targetRef)) continue;
        const srcCell = cells.get(refName(srcC1 + srcColOffset, r));
        if(!srcCell){ cells.delete(targetRef); continue }
        const newCell = clearServerMetadata(JSON.parse(JSON.stringify(srcCell)));
        if(newCell.v && String(newCell.v).charAt(0) === "=")
          newCell.v = shiftFormula(String(newCell.v), 0, c - (srcC1 + srcColOffset));
        cells.set(targetRef, newCell);
      }
    }
  } else if(d.dir === "left"){
    for(let c = srcC1 - 1; c >= d.endC; c--){
      const srcColOffset = (srcC1 - c) % srcW;
      const srcCol = srcC2 - srcColOffset;
      for(let r = srcR1; r <= srcR2; r++){
        const targetRef = refName(c, r);
        if(isProtectedCell(targetRef)) continue;
        const srcCell = cells.get(refName(srcCol, r));
        if(!srcCell){ cells.delete(targetRef); continue }
        const newCell = clearServerMetadata(JSON.parse(JSON.stringify(srcCell)));
        if(newCell.v && String(newCell.v).charAt(0) === "=")
          newCell.v = shiftFormula(String(newCell.v), 0, c - srcCol);
        cells.set(targetRef, newCell);
      }
    }
  }
  invalidateAll(); saveLocal(); render();
  showToast("📋 Recopié");
}

function shiftFormula(formula, dRow, dCol){
  if(!formula || formula.charAt(0) !== "=") return formula;
  return formula.replace(/(\$?)([A-Z]+)(\$?)(\d+)/g, function(match, absCol, col, absRow, row){
    let c = colIndex(col), r = parseInt(row,10)-1;
    if(!absCol) c += dCol;
    if(!absRow) r += dRow;
    if(c < 0 || r < 0) return "#REF!";
    return absCol + colName(c) + absRow + (r+1);
  });
}

/* ============================================================
   COPIER / COLLER
   ============================================================ */
function doCopy(cut){
  if(editingRef) endEdit(true);
  const selCells = getSelectedCells();
  if(!selCells.length){ showToast("Rien à copier"); return }
  let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
  selCells.forEach(function(sc){
    if(sc.r < minR) minR = sc.r;
    if(sc.r > maxR) maxR = sc.r;
    if(sc.c < minC) minC = sc.c;
    if(sc.c > maxC) maxC = sc.c;
  });
  const w = maxC - minC + 1, h = maxR - minR + 1;
  const selSet = new Set(selCells.map(function(sc){ return sc.ref }));
  const preserveRowMetadata = cut && isDataSheet(activeSheet()) && minR > 0 &&
    minC === 0 && maxC === COLS - 1 && selCells.length === h * COLS;
  const data = [];
  for(let r = minR; r <= maxR; r++){
    const line = [];
    for(let c = minC; c <= maxC; c++){
      const ref = refName(c, r);
      if(selSet.has(ref)){
        const cell = cells.get(ref);
        line.push(cell ? (preserveRowMetadata ? JSON.parse(JSON.stringify(cell)) : clearServerMetadata(JSON.parse(JSON.stringify(cell)))) : null);
      } else line.push(undefined);
    }
    data.push(line);
  }
  clipboard = {mode:cut?"cut":"copy", data:data, w:w, h:h, srcTop:minR, srcLeft:minC, preserveRowMetadata:preserveRowMetadata};
  const tsv = data.map(function(line){
    return line.map(function(c){ return encodeClipboardCell(c && c.v != null ? c.v : "") }).join("\t");
  }).join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(tsv).catch(function(){ fallbackCopy(tsv) });
  else fallbackCopy(tsv);
  if(cut) render();
  showToast(cut ? "✂ Coupé (" + selCells.length + " cellules)" : "⧉ Copié (" + selCells.length + " cellules)");
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy") }catch(e){}
  document.body.removeChild(ta);
}

function encodeClipboardCell(value){
  const text = value == null ? "" : String(value);
  return /["\t\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function parseClipboardMatrix(text){
  const rows = [];
  let row = [], value = "", inQuotes = false, fieldStarted = false;
  for(let i = 0; i < text.length; i++){
    const char = text.charAt(i);
    if(char === '"'){
      if(inQuotes && text.charAt(i + 1) === '"'){
        value += '"';
        fieldStarted = true;
        i++;
      } else if(inQuotes){
        inQuotes = false;
      } else if(value === ""){
        inQuotes = true;
        fieldStarted = true;
      } else {
        value += char;
        fieldStarted = true;
      }
    } else if(!inQuotes && char === "\t"){
      row.push(value);
      value = "";
      fieldStarted = false;
    } else if(!inQuotes && (char === "\r" || char === "\n")){
      row.push(value);
      rows.push(row);
      row = [];
      value = "";
      fieldStarted = false;
      if(char === "\r" && text.charAt(i + 1) === "\n") i++;
    } else {
      value += char;
      fieldStarted = true;
    }
  }
  if(row.length || value !== "" || fieldStarted) {
    row.push(value);
    rows.push(row);
  }
  return rows;
}

function clearCellValue(ref){
  const cell = cells.get(ref);
  if(!cell) return;
  const cleared = Object.assign({}, cell);
  delete cleared.v;
  if(Object.keys(cleared).length) cells.set(ref, cleared);
  else cells.delete(ref);
}

function doPasteFromClipboardText(text){
  if(!text) return;
  const matrix = parseClipboardMatrix(text);
  if(!matrix.length) return;

  let targetR = 0, targetC = 0;
  if(selectedRows.size > 0) targetR = Math.min.apply(null, [...selectedRows]);
  if(selectedCols.size > 0) targetC = Math.min.apply(null, [...selectedCols]);
  if(!selectedRows.size && !selectedCols.size && !selectAllActive){
    const rec = rect(); targetR = rec.r1; targetC = rec.c1;
  }

  pushUndo();
  const columns = isDataSheet(activeSheet()) ? getApiColumns(activeSheet()) : [];
  let skipped = 0, truncated = 0;
  matrix.forEach(function(line, i){
    line.forEach(function(rawVal, j){
      const tr = targetR + i, tc = targetC + j;
      if(tr >= EXCEL_MAX_ROWS || tc >= COLS){ truncated++; return }
      const targetRef = refName(tc, tr);
      if(isProtectedCell(targetRef)){ skipped++; return; }
      if(rawVal === ""){ clearCellValue(targetRef); return }
      const c = Object.assign({}, cells.get(targetRef) || {});
      c.v = rawVal;
      cells.set(targetRef, c);
    });
  });
  const touchedRows = new Set();
  matrix.forEach(function(line, i){
    const row = targetR + i;
    if(row < EXCEL_MAX_ROWS) touchedRows.add(row);
  });
  touchedRows.forEach(function(row){
    if(columns.length && !isApiRecordEmpty(apiRecordFromSheet(activeSheet(), row, columns)))
      assignActiveOwnerToRow(row);
    if(row > 0) queueServerDeleteForEmptyRow(row);
  });
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); render();
  let msg = "📋 Collé (" + matrix.length + " ligne(s))";
  if(skipped > 0) msg += " — " + skipped + " protégée(s)";
  if(truncated > 0) msg += " — " + truncated + " hors limites";
  showToast(msg);
}

function doPaste(){
  if(editingRef) endEdit(true);
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(text){
      if(text && /[\t\r\n]/.test(text)){
        doPasteFromClipboardText(text);
      } else if(clipboard){
        doPasteInternal();
      } else if(text){
        doPasteFromClipboardText(text);
      }
    }).catch(function(){
      if(clipboard) doPasteInternal();
    });
  } else if(clipboard){
    doPasteInternal();
  }
}

function doPasteInternal(){
  if(!clipboard) return;
  pushUndo();
  let targetR = 0, targetC = 0;
  if(selectedRows.size > 0) targetR = Math.min.apply(null, [...selectedRows]);
  if(selectedCols.size > 0) targetC = Math.min.apply(null, [...selectedCols]);
  if(!selectedRows.size && !selectedCols.size && !selectAllActive){
    const rec = rect(); targetR = rec.r1; targetC = rec.c1;
  }
  const columns = isDataSheet(activeSheet()) ? getApiColumns(activeSheet()) : [];
  if(clipboard.mode === "cut" && clipboard.preserveRowMetadata && columns.length){
    const movedIds = new Set();
    for(let i = 0; i < clipboard.h; i++){
      const sourceId = getRowServerId(activeSheet(), clipboard.srcTop + i, columns);
      if(sourceId) movedIds.add(sourceId);
    }
    for(let i = 0; i < clipboard.h; i++){
      const targetRow = targetR + i;
      if(targetRow >= EXCEL_MAX_ROWS || (targetRow >= clipboard.srcTop && targetRow < clipboard.srcTop + clipboard.h)) continue;
      const targetId = getRowServerId(activeSheet(), targetRow, columns);
      if(targetId && !movedIds.has(targetId)) pendingServerDeletes.add(targetId);
    }
  }
  let skipped = 0, truncated = 0;
  for(let i=0; i<clipboard.h; i++){
    for(let j=0; j<clipboard.w; j++){
      const srcCell = clipboard.data[i][j];
      if(srcCell === undefined) continue;
      const tr = targetR + i, tc = targetC + j;
      if(tr >= EXCEL_MAX_ROWS || tc >= COLS){ truncated++; continue }
      const targetRef = refName(tc, tr);
      if(isProtectedCell(targetRef)){ skipped++; continue; }
      if(!srcCell){ clearCellValue(targetRef); continue }
      const targetCell = cells.get(targetRef);
      const newCell = JSON.parse(JSON.stringify(srcCell));
      if(clipboard.mode === "copy" || !clipboard.preserveRowMetadata){
        clearServerMetadata(newCell);
        ["_serverId", "_localBaseline", "_serverFingerprint"].forEach(function(key){
          if(targetCell && targetCell[key] !== undefined) newCell[key] = targetCell[key];
        });
      }
      if(newCell.v && String(newCell.v).charAt(0) === "=")
        newCell.v = shiftFormula(String(newCell.v), tr - clipboard.srcTop, tc - clipboard.srcLeft);
      cells.set(targetRef, newCell);
    }
  }
  if(clipboard.mode === "cut"){
    for(let i=0; i<clipboard.h; i++){
      for(let j=0; j<clipboard.w; j++){
        if(clipboard.data[i][j] === undefined) continue;
        const sr = clipboard.srcTop + i, sc = clipboard.srcLeft + j;
        const overlaps = (sr >= targetR && sr < targetR + clipboard.h && sc >= targetC && sc < targetC + clipboard.w);
        if(!overlaps){
          if(clipboard.preserveRowMetadata) cells.delete(refName(sc, sr));
          else clearCellValue(refName(sc, sr));
        }
      }
    }
    clipboard.mode = "copy";
  }
  const touchedRows = new Set();
  for(let i = 0; i < clipboard.h; i++){
    const row = targetR + i;
    if(row < EXCEL_MAX_ROWS) touchedRows.add(row);
  }
  touchedRows.forEach(function(row){
    if(columns.length && !isApiRecordEmpty(apiRecordFromSheet(activeSheet(), row, columns)))
      assignActiveOwnerToRow(row);
    if(row > 0) queueServerDeleteForEmptyRow(row);
  });
  syncActiveSheetRefs();
  invalidateAll(); saveLocal(); render();
  let msg = "📋 Collé";
  if(skipped > 0) msg += " — " + skipped + " protégée(s)";
  if(truncated > 0) msg += " — " + truncated + " hors limites";
  showToast(msg);
}

function toggleStyle(prop){
  if(editingRef) endEdit(true);
  const selCells = getSelectedCells();
  if(!selCells.length) return;
  const curCell = cells.get(currentRef);
  const curSt = curCell && curCell.s ? curCell.s : {};
  const newVal = !curSt[prop];
  pushUndo();
  selCells.forEach(function(sc){
    if(isProtectedCell(sc.ref)) return;
    const c = Object.assign({}, cells.get(sc.ref) || {});
    const s = Object.assign({}, c.s || {});
    if(newVal) s[prop] = true; else delete s[prop];
    c.s = s;
    if(Object.keys(c).length === 0) cells.delete(sc.ref);
    else cells.set(sc.ref, c);
  });
  saveLocal(); render();
}
function applyBg(color){
  if(editingRef) endEdit(true);
  const selCells = getSelectedCells();
  if(!selCells.length) return;
  pushUndo();
  selCells.forEach(function(sc){
    if(isProtectedCell(sc.ref)) return;
    const c = Object.assign({}, cells.get(sc.ref) || {});
    const s = Object.assign({}, c.s || {});
    if(color) s.bg = color; else delete s.bg;
    c.s = s;
    if(Object.keys(c).length === 0) cells.delete(sc.ref);
    else cells.set(sc.ref, c);
  });
  saveLocal(); render();
}
function deleteSelection(){
  if(editingRef) endEdit(true);
  const selCells = getSelectedCells();
  if(!selCells.length) return;
  const deletable = selCells.filter(function(sc){ return !isProtectedCell(sc.ref) });
  if(!deletable.length){ showToast("🔒 Aucune cellule modifiable"); return; }
  pushUndo();
  deletable.forEach(function(sc){ cells.delete(sc.ref) });
  invalidateAll(); saveLocal(); render();
  if(deletable.length < selCells.length){
    showToast("🗑 " + deletable.length + " effacée(s) — " + (selCells.length - deletable.length) + " protégée(s)");
  }
}

/* ============================================================
   DROPDOWN — injecté DANS le td, position:absolute top:100%
   ✅ FIX : saisie libre autorisée + liste déroulante
   ============================================================ */
function ensureMenuElement(id){
  let menu = document.getElementById(id);
  if(!menu){
    menu = document.createElement("div");
    menu.id = id;
    document.body.appendChild(menu);
  }
  return menu;
}

function openDropdown(td, colIdx, rowIdx){
  if(!isDataSheet(activeSheet())) return;
  if(rowIdx === 0) return;
  if(!td || !td.isConnected) return;
  const cfg = currentHeaders[colIdx];
  if(!cfg || cfg.type !== "dropdown") return;
  const items = DROPDOWN_DATA[cfg.dropdownKey] || [];
  if(!items.length) return;

  removeDropdownKeyHandler();
  closeFilterMenu();

  const menu = ensureMenuElement("dropdownMenu");
  if(menu.parentNode) menu.parentNode.removeChild(menu);

  const currentVal = (cells.get(refName(colIdx, rowIdx)) || {}).v || "";
  let html = "";
  /* ✅ Toujours afficher la barre de recherche pour permettre la saisie libre */
  html += '<div class="dd-search"><input type="text" id="ddSearch" placeholder="Rechercher ou saisir une valeur libre..." autocomplete="off" value="' + escapeHtml(currentVal) + '"></div>';
  items.forEach(function(item, i){
    const active = (item === currentVal) ? " active" : "";
    html += '<div class="dd-item' + active + '" data-value="' + escapeHtml(item) + '" data-idx="' + i + '">' + escapeHtml(item) + '</div>';
  });
  /* ✅ Indication qu'on peut saisir librement */
  html += '<div class="dd-free-hint">💡 Tapez une valeur puis <b>Entrée</b> pour valider librement</div>';
  menu.innerHTML = html;

  td.appendChild(menu);
  td.classList.add("dropdown-open");
  menu.classList.add("show");

  activeDropdownCell = {td: td, colIdx: colIdx, rowIdx: rowIdx};
  dropdownOpeningTime = Date.now();

  let visibleItems = [];
  let selectedIdx = -1;

  function updateVisibleItems(){
    visibleItems = [];
    menu.querySelectorAll(".dd-item").forEach(function(el){
      if(el.style.display !== "none") visibleItems.push(el);
    });
  }
  function highlight(idx){
    if(!visibleItems.length) { selectedIdx = -1; return; }
    if(idx < 0) idx = 0;
    if(idx >= visibleItems.length) idx = visibleItems.length - 1;
    visibleItems.forEach(function(el, i){
      if(i === idx) el.classList.add("active");
      else el.classList.remove("active");
    });
    if(visibleItems[idx]) visibleItems[idx].scrollIntoView({block:"nearest"});
    selectedIdx = idx;
  }

  const searchInput = document.getElementById("ddSearch");
  if(searchInput){
    /* Sélectionner tout le texte au focus pour permettre la saisie directe */
    searchInput.addEventListener("input", function(){
      const q = searchInput.value.toLowerCase();
      menu.querySelectorAll(".dd-item").forEach(function(el){
        el.style.display = el.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
      });
      updateVisibleItems();
      selectedIdx = -1;
      visibleItems.forEach(function(el, i){ if(el.classList.contains("active")) selectedIdx = i; });
      if(selectedIdx < 0 && visibleItems.length > 0) highlight(0);
    });
    /* ✅ Entrée dans le champ de recherche : valider la valeur saisie librement */
    searchInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        e.stopPropagation();
        const typedVal = searchInput.value.trim();
        if(typedVal !== ""){
          /* Si la valeur correspond exactement à un item, on l'applique */
          /* Sinon on applique la valeur libre saisie */
          applyDropdownValue(colIdx, rowIdx, typedVal);
        } else {
          closeDropdown();
        }
      }
    });
    setTimeout(function(){
      if(searchInput && document.body.contains(searchInput)){
        searchInput.focus();
        searchInput.select();
      }
    }, 50);
  }
  updateVisibleItems();

  menu.querySelectorAll(".dd-item").forEach(function(el){
    const handler = function(e){
      e.preventDefault();
      e.stopPropagation();
      applyDropdownValue(colIdx, rowIdx, el.dataset.value);
    };
    el.addEventListener("mousedown", handler);
    el.addEventListener("click", handler);
  });

  visibleItems.forEach(function(el, i){
    if(el.classList.contains("active")) selectedIdx = i;
  });
  if(selectedIdx < 0 && visibleItems.length > 0) highlight(0);

  dropdownKeyHandler = function(e){
    if(!activeDropdownCell) return;
    /* Ne pas interférer si on tape dans le champ de recherche */
    if(e.target && e.target.id === "ddSearch"){
      return;
    }
    if(e.key === "ArrowDown"){
      e.preventDefault(); e.stopPropagation();
      highlight(Math.min(selectedIdx + 1, visibleItems.length - 1));
    } else if(e.key === "ArrowUp"){
      e.preventDefault(); e.stopPropagation();
      highlight(Math.max(selectedIdx - 1, 0));
    } else if(e.key === "Enter"){
      e.preventDefault(); e.stopPropagation();
      if(visibleItems[selectedIdx]){
        applyDropdownValue(colIdx, rowIdx, visibleItems[selectedIdx].dataset.value);
      } else {
        closeDropdown();
      }
    } else if(e.key === "Escape"){
      e.preventDefault(); e.stopPropagation();
      closeDropdown();
    } else if(e.key === "Tab"){
      e.preventDefault(); e.stopPropagation();
      if(visibleItems[selectedIdx]){
        applyDropdownValue(colIdx, rowIdx, visibleItems[selectedIdx].dataset.value);
      } else {
        closeDropdown();
      }
      setTimeout(function(){ move(e.shiftKey ? -1 : 1, 0) }, 50);
    }
  };
  document.addEventListener("keydown", dropdownKeyHandler, true);
}

function applyDropdownValue(colIdx, rowIdx, val){
  const ref = refName(colIdx, rowIdx);
  pushUndo();
  const c = Object.assign({}, cells.get(ref) || {});
  if(val === "") delete c.v; else c.v = val;
  if(Object.keys(c).length === 0) cells.delete(ref);
  else cells.set(ref, c);
  invalidateAll();
  saveLocal();

  closeDropdown();

  const td = table.querySelector('td[data-ref="' + ref + '"]');
  if(td){
    td.textContent = str(val);
    if(val !== "") td.classList.remove("err");
  }

  render();
  showToast("✓ " + val);
}

function removeDropdownKeyHandler(){
  if(dropdownKeyHandler){
    document.removeEventListener("keydown", dropdownKeyHandler, true);
    dropdownKeyHandler = null;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function closeDropdown(){
  removeDropdownKeyHandler();
  const menu = document.getElementById("dropdownMenu");
  if(!menu){
    activeDropdownCell = null;
    dropdownOpeningTime = 0;
    return;
  }
  menu.classList.remove("show");
  if(menu.parentNode && menu.parentNode !== document.body){
    menu.parentNode.classList.remove("dropdown-open");
    document.body.appendChild(menu);
  }
  activeDropdownCell = null;
  dropdownOpeningTime = 0;
}

/* ============================================================
   FILTRES — menu injecté DANS le td d'en-tête, position:absolute top:100%
   ============================================================ */
function openFilterMenu(colIdx, td){
  if(editingRef) endEdit(true);
  closeDropdown();
  if(!td || !td.isConnected) return;

  const menu = ensureMenuElement("filterMenu");
  if(menu.parentNode) menu.parentNode.removeChild(menu);

  const values = getColumnFilterValues(colIdx);
  const sorted = Array.from(values).sort(function(a,b){
    if(a === "") return -1;
    if(b === "") return 1;
    const na = numOrNull(a), nb = numOrNull(b);
    if(na !== null && nb !== null) return na - nb;
    return a.localeCompare(b, "fr");
  });
  let accepted = filters.get(colIdx);
  if(!accepted) accepted = new Set(sorted);
  else accepted = new Set(sorted.filter(value => accepted.has(value)));

  const headerName = currentHeaders[colIdx] ? currentHeaders[colIdx].header : colName(colIdx);
  let html = '<h4>Filtrer ' + escapeHtml(headerName) + '</h4>';
  html += '<input type="text" id="filterSearch" placeholder="Rechercher...">';
  html += '<div class="values-list" id="filterValues">';
  html += '<label><input type="checkbox" id="filterAll"' + (sorted.every(value => accepted.has(value)) ? ' checked' : '') + '> <b>(Tout)</b></label>';
  sorted.forEach(function(v){
    const checked = accepted.has(v) ? " checked" : "";
    const label = v === "" ? "(Vides)" : escapeHtml(v);
    html += '<label><input type="checkbox" class="filter-value" value="' + escapeHtml(v) + '"' + checked + '> ' + label + '</label>';
  });
  if(sorted.length === 0) html += '<div style="padding:6px;color:#999">Aucune valeur</div>';
  html += '</div>';
  html += '<div class="filter-actions">';
  html += '<button id="filterClear">Effacer</button>';
  html += '<button id="filterCancel">Annuler</button>';
  html += '<button id="filterApply" class="primary">OK</button>';
  html += '</div>';
  menu.innerHTML = html;

  td.appendChild(menu);
  td.classList.add("filter-open");
  menu.classList.add("show");

  const searchInput = document.getElementById("filterSearch");
  searchInput.addEventListener("input", function(){
    const q = searchInput.value.toLowerCase();
    menu.querySelectorAll("#filterValues label").forEach(function(lbl){
      const cb = lbl.querySelector("input");
      if(!cb) return;
      lbl.style.display = lbl.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
    });
  });
  const allCb = document.getElementById("filterAll");
  allCb.addEventListener("change", function(){
    menu.querySelectorAll(".filter-value").forEach(function(cb){ cb.checked = allCb.checked });
  });
  document.getElementById("filterClear").onclick = function(){
    filters.delete(colIdx);
    saveActiveFilters();
    invalidateFilteredRowsCache();
    closeFilterMenu();
    buildGrid();
    render();
    showToast("🔽 Filtre effacé");
  };
  document.getElementById("filterCancel").onclick = closeFilterMenu;
  document.getElementById("filterApply").onclick = function(){
    const checked = new Set();
    menu.querySelectorAll(".filter-value:checked").forEach(function(cb){ checked.add(cb.value) });
    if(sorted.every(value => checked.has(value))) filters.delete(colIdx);
    else filters.set(colIdx, checked);
    saveActiveFilters();
    invalidateFilteredRowsCache();
    closeFilterMenu();
    buildGrid();
    render();
    showToast("🔽 Filtre appliqué");
  };
  setTimeout(function(){ searchInput.focus() }, 50);
}

function closeFilterMenu(){
  const menu = document.getElementById("filterMenu");
  if(!menu) return;
  menu.classList.remove("show");
  if(menu.parentNode && menu.parentNode !== document.body){
    menu.parentNode.classList.remove("filter-open");
    document.body.appendChild(menu);
  }
}

function getColumnFilterValues(colIdx){
  const values = new Set();
  const sheet = activeSheet();
  const columns = isDataSheet(sheet) ? getApiColumns(sheet) : [];
  const ownerColumn = sheet.type === "colonne"
    ? columns.find(column => column.field === "acheteur") : null;
  const ownerKey = normalizeOwnerName(activeOwnerFilter);

  const rows = columns.length
    ? getPopulatedApiRows(sheet, columns)
    : Array.from(new Set(Array.from(sheet.cells.keys())
        .map(ref => parseRef(ref))
        .filter(p => p && p.r > 0)
        .map(p => p.r))).sort((a, b) => a - b);

  for(const row of rows){
    if(ownerColumn){
      const rowOwner = normalizeOwnerName(cells.get(refName(ownerColumn.col, row))?.v);
      if(rowOwner && rowOwner !== ownerKey) continue;
    }
    const value = str(evaluate(refName(colIdx, row)));
    values.add(value);
  }
  return values;
}

function applyFilters(){
  const row0 = table.querySelector('tbody tr[data-row="0"]');
  if(row0){
    row0.querySelectorAll("td").forEach(function(td){
      const c = parseInt(td.dataset.col, 10);
      td.classList.toggle("has-filter", filters.has(c));
    });
  }
}

function toggleFilterCurrentCol(){
  const p = parseRef(currentRef);
  if(filters.has(p.c)){
    filters.delete(p.c);
  } else {
    const values = getColumnFilterValues(p.c);
    if(values.size === 0) return;
    filters.set(p.c, values);
  }
  saveActiveFilters();
  invalidateFilteredRowsCache();
  buildGrid();
  render();
}

  html += '<div class="ctx-item" data-action="insert-row-above">➕ Insérer ligne au-dessus<span class="shortcut">Ctrl++</span></div>';
  html += '<div class="ctx-item" data-action="insert-row-below">➕ Insérer ligne en dessous</div>';
  html += '<div class="ctx-item danger" data-action="delete-row">➖ Supprimer ligne(s)<span class="shortcut">Ctrl+-</span></div>';
  html += '<div class="ctx-sep"></div>';
  html += '<div class="ctx-item" data-action="insert-col-left">➕ Insérer colonne à gauche</div>';

  html += '<div class="ctx-item danger' + (prot?" disabled":"") + '" data-action="clear">🗑 Effacer contenu<span class="shortcut">Suppr</span></div>';
  menu.innerHTML = html;
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.classList.add("show");

  menu.querySelectorAll(".ctx-item").forEach(function(el){
    el.addEventListener("click", function(){
      if(el.classList.contains("disabled")) return;
      const action = el.dataset.action;
      menu.classList.remove("show");
      handleContextAction(action);
    });
  });

function handleContextAction(action){
  const p = parseRef(currentRef);
  switch(action){
    case "cut": doCopy(true); break;
    case "copy": doCopy(false); break;
    case "paste": doPaste(); break;
    case "insert-row-above": {
      const rows = selectedRows.size > 0 ? selectedRows.size : 1;
      const at = selectedRows.size > 0 ? Math.min.apply(null, [...selectedRows]) : p.r;
      insertRow(at, rows);
      selectedRows.clear();
      break;
    }
    case "insert-row-below": insertRow(p.r + 1, 1); break;
    case "delete-row": {
      const rows = selectedRows.size > 0 ? selectedRows.size : 1;
      const at = selectedRows.size > 0 ? Math.min.apply(null, [...selectedRows]) : p.r;
      deleteRow(at, rows);
      selectedRows.clear();
      break;
    }
    case "insert-col-left": insertCol(p.c, 1); break;
    case "insert-col-right": insertCol(p.c + 1, 1); break;
    case "delete-col": {
      const cols = selectedCols.size > 0 ? selectedCols.size : 1;
      const at = selectedCols.size > 0 ? Math.min.apply(null, [...selectedCols]) : p.c;
      deleteCol(at, cols);
      selectedCols.clear();
      break;
    }
    case "sort-asc": sortColumn(p.c, true); break;
    case "sort-desc": sortColumn(p.c, false); break;
    case "clear": deleteSelection(); break;
  }
}

let searchMatches = [];
let searchIdx = -1;
function openSearch(){
  document.getElementById("searchBox").classList.add("show");
  const inp = document.getElementById("searchInput");
  inp.focus(); inp.select();
}
function closeSearch(){
  document.getElementById("searchBox").classList.remove("show");
  searchMatches = []; searchIdx = -1;
  table.querySelectorAll(".found").forEach(function(td){ td.classList.remove("found") });
}
function performSearch(){
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  searchMatches = []; searchIdx = -1;
  table.querySelectorAll(".found").forEach(function(td){ td.classList.remove("found") });
  if(!q) return;
  for(const ref of cells.keys()){
    const position = parseRef(ref);
    if(!position || position.r >= ROWS || position.c >= COLS) continue;
    const v = str(evaluate(ref)).toLowerCase();
    const raw = cells.get(ref);
    const rawV = raw && raw.v ? String(raw.v).toLowerCase() : "";
    if(v.indexOf(q) >= 0 || rawV.indexOf(q) >= 0){
      searchMatches.push(ref);
      const td = table.querySelector('td[data-ref="' + ref + '"]');
      if(td) td.classList.add("found");
    }
  }
  if(searchMatches.length){
    searchIdx = 0;
    setCurrent(searchMatches[0]);
    showToast("🔍 " + searchMatches.length + " résultat(s)");
  } else {
    showToast("Aucun résultat");
  }
}
function searchNext(){
  if(!searchMatches.length) return;
  searchIdx = (searchIdx + 1) % searchMatches.length;
  setCurrent(searchMatches[searchIdx]);
}
function searchPrev(){
  if(!searchMatches.length) return;
  searchIdx = (searchIdx - 1 + searchMatches.length) % searchMatches.length;
  setCurrent(searchMatches[searchIdx]);
}

const SHEET_COLORS = ["#1a73e8","#f9ab00","#0f9d58","#d93025","#7b1fa2","#0097a7"];

function countDataRows(sheet){
  const rowsSet = new Set();
  sheet.cells.forEach(function(cell, ref){
    if(cell && cell.v != null && cell.v !== ""){
      const p = parseRef(ref);
      if(p && p.r > 0) rowsSet.add(p.r);
    }
  });
  return rowsSet.size;
}

function normalizeOwnerName(value){
  return String(value == null ? "" : value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().replace(/\s+/g, " ").toLocaleLowerCase("fr");
}

function getOwnerFiltersFor(ownerName){
  const ownerKey = normalizeOwnerName(ownerName);
  if(!ownerFiltersByName.has(ownerKey)) ownerFiltersByName.set(ownerKey, new Map());
  return ownerFiltersByName.get(ownerKey);
}

function saveOwnerFilters(){
  const savedFilters = Array.from(ownerFiltersByName.entries()).map(function(entry){
    return [entry[0], Array.from(entry[1].entries()).map(function(filter){
      return [filter[0], Array.from(filter[1])];
    })];
  });
  localStorage.setItem("tableur_da_v13_owner_filters", JSON.stringify(savedFilters));
}

function loadOwnerFilters(){
  try{
    const savedFilters = JSON.parse(localStorage.getItem("tableur_da_v13_owner_filters") || "[]");
    if(!Array.isArray(savedFilters)) return new Map();
    return new Map(savedFilters.filter(entry => Array.isArray(entry) && Array.isArray(entry[1])).map(function(entry){
      const columnFilters = entry[1].filter(filter => Array.isArray(filter) && Array.isArray(filter[1])).map(function(filter){
        return [Number(filter[0]), new Set(filter[1].map(String))];
      });
      return [String(entry[0]), new Map(columnFilters)];
    }));
  }catch(e){ return new Map() }
}

function saveSheetFilters(){
  const savedFilters = {};
  sheets.forEach(function(sheet){
    if(sheet.type === "colonne") return;
    savedFilters[sheet.id] = Array.from(sheet.filters.entries()).map(function(entry){
      return [entry[0], Array.from(entry[1])];
    });
  });
  localStorage.setItem("tableur_da_v13_sheet_filters", JSON.stringify(savedFilters));
}

function loadSheetFilters(){
  try{
    const savedFilters = JSON.parse(localStorage.getItem("tableur_da_v13_sheet_filters") || "{}");
    if(!savedFilters || typeof savedFilters !== "object" || Array.isArray(savedFilters)) return new Map();
    return new Map(Object.entries(savedFilters).map(function(entry){
      const filtersForSheet = Array.isArray(entry[1]) ? entry[1] : [];
      return [entry[0], new Map(filtersForSheet.filter(filter => Array.isArray(filter) && Array.isArray(filter[1])).map(function(filter){
        return [Number(filter[0]), new Set(filter[1].map(String))];
      }))];
    }));
  }catch(e){ return new Map() }
}

function saveActiveFilters(){
  if(activeSheet().type === "colonne") saveOwnerFilters();
  else saveSheetFilters();
}

function getOwnerRowsIndex(sheet){
  if(ownerRowsIndexCache && ownerRowsIndexCache.sheet === sheet && ownerRowsIndexCache.cells === sheet.cells) return ownerRowsIndexCache;
  const columns = getApiColumns(sheet);
  const ownerColumn = columns.find(column => column.field === "acheteur");
  const rows = ownerColumn ? getPopulatedApiRows(sheet, columns) : [];
  const rowsByOwner = new Map();
  rows.forEach(function(row){
    const ownerKey = normalizeOwnerName(sheet.cells.get(refName(ownerColumn.col, row))?.v);
    if(!ownerKey) return;
    if(!rowsByOwner.has(ownerKey)) rowsByOwner.set(ownerKey, []);
    rowsByOwner.get(ownerKey).push(row);
  });
  ownerRowsIndexCache = {
    sheet, cells: sheet.cells, ownerColumn, rowsByOwner
  };
  return ownerRowsIndexCache;
}

function scrollToOwnerRows(ownerName){
  const sheet = activeSheet();
  const ownerRowsIndex = getOwnerRowsIndex(sheet);
  if(!ownerRowsIndex.ownerColumn){
    gridWrap.scrollTop = 0;
    return;
  }
  const ownerKey = normalizeOwnerName(ownerName);
  const firstRow = (ownerRowsIndex.rowsByOwner.get(ownerKey) || [])[0];
  if(firstRow === undefined){
    gridWrap.scrollTop = 0;
    return;
  }
  const virtualWindow = getVirtualWindow();
  if(virtualWindow.isFiltered && virtualWindow.rows){
    const idx = virtualWindow.rows.indexOf(firstRow);
    if(idx >= 0){
      gridWrap.scrollTop = virtualWindow.fixedHeight + idx * virtualWindow.rowScale;
    }
  } else {
    gridWrap.scrollTop = virtualWindow.fixedHeight + Math.max(0, firstRow - virtualWindow.dataStart) * virtualWindow.rowScale;
  }
}

function countRowsForOwner(sheet, ownerName){
  const columns = getApiColumns(sheet);
  const ownerColumn = columns.find(column => column.field === "acheteur");
  if(!ownerColumn) return 0;
  const ownerKey = normalizeOwnerName(ownerName);
  return getPopulatedApiRows(sheet, columns).filter(function(row){
    return normalizeOwnerName(sheet.cells.get(refName(ownerColumn.col, row))?.v) === ownerKey;
  }).length;
}

function renderSheetTabs(){
  const container = document.getElementById("sheetTabs");
  container.querySelectorAll(".sheet-tab").forEach(function(t){ t.remove() });
  sheets.forEach(function(sheet, idx){
    if(sheet.type === "colonne"){
      IN_PROGRESS_OWNERS.forEach(function(owner){
        if(!isSheetVisible(sheet, owner.name)) return;
        const tab = document.createElement("button");
        tab.className = "sheet-tab" + (idx === activeSheetIdx && owner.name === activeOwnerFilter ? " active" : "");
        const colorDot = document.createElement("span");
        colorDot.className = "tab-color";
        colorDot.style.background = owner.color;
        tab.appendChild(colorDot);
        const nameSpan = document.createElement("span");
        const sheetName = getSheetDisplayName(sheet, owner.name);
        nameSpan.textContent = sheetName;
        tab.title = sheetName;
        tab.appendChild(nameSpan);
        const countBadge = document.createElement("span");
        countBadge.className = "tab-count";
        countBadge.textContent = countRowsForOwner(sheet, owner.name);
        tab.appendChild(countBadge);
        tab.addEventListener("click", function(){ switchOwnerTab(idx, owner.name) });
        container.insertBefore(tab, document.getElementById("btnAddSheet"));
      });
      return;
    }
    if(!isSheetVisible(sheet)) return;
    const isActive = (idx === activeSheetIdx);
    const rowCount = countDataRows(sheet);
    const tab = document.createElement("button");
    tab.className = "sheet-tab" + (isActive ? " active" : "");
    const colorDot = document.createElement("span");
    colorDot.className = "tab-color";
    colorDot.style.background = sheet.color;
    tab.appendChild(colorDot);
    const nameSpan = document.createElement("span");
    nameSpan.textContent = getSheetDisplayName(sheet);
    tab.appendChild(nameSpan);
    const countBadge = document.createElement("span");
    countBadge.className = "tab-count";
    countBadge.textContent = rowCount;
    tab.appendChild(countBadge);
    tab.addEventListener("click", function(){ switchSheet(idx) });
    if(!MANAGED_SHEET_TYPES.has(sheet.type)) tab.addEventListener("dblclick", function(){
      const newName = prompt("Renommer la feuille :", sheet.name);
      if(newName && newName.trim()){
        pushUndo();
        sheet.name = newName.trim();
        saveLocal();
        renderSheetTabs();
      }
    });
    container.insertBefore(tab, document.getElementById("btnAddSheet"));
  });
}

function switchOwnerTab(idx, ownerName){
  if(idx === activeSheetIdx && ownerName === activeOwnerFilter){
    if(editingRef) endEdit(true);
    closeDropdown(); closeFilterMenu();
    if(["colonne", "tous"].includes(activeSheet().type)) scrollToOwnerEntryRows();
    buildGrid();
    renderSheetTabs();
    render();
    return;
  }
  if(editingRef) endEdit(true);
  closeDropdown(); closeFilterMenu();
  activeSheetIdx = idx;
  activeOwnerFilter = ownerName;
  syncActiveSheetRefs();
  invalidateAll();
  selectedRows.clear(); selectedCols.clear(); selectAllActive = false;
  multiSelected.clear();
  currentRef = "A1"; selectedAnchor = "A1";
  scrollToOwnerEntryRows();
  buildGrid();
  renderSheetTabs();
  render();
  showToast("📄 " + ownerName);
}

function switchSheet(idx){
  if(idx === activeSheetIdx) return;
  if(!isSheetVisible(sheets[idx])) return;
  if(editingRef) endEdit(true);
  closeDropdown(); closeFilterMenu();
  activeSheetIdx = idx;
  syncActiveSheetRefs();
  invalidateAll();
  selectedRows.clear(); selectedCols.clear(); selectAllActive = false;
  multiSelected.clear();
  currentRef = "A1"; selectedAnchor = "A1";
  if(activeSheet().type === "tous") scrollToOwnerEntryRows();
  buildGrid();
  renderSheetTabs();
  render();
  showToast("📄 " + activeSheet().name);
}

function addSheet(){
  pushUndo();
  const newIdx = sheets.length;
  sheets.push({
    id: "sheet_" + Date.now(),
    name: "Feuille " + (newIdx + 1),
    color: SHEET_COLORS[newIdx % SHEET_COLORS.length],
    type: "blank", headers: [], rows: EMPTY_ROWS_PER_SHEET + 1,
    cells: new Map(), filters: new Map()
  });
  saveLocal();
  switchSheet(newIdx);
}

function insertTextInFormula(text){
  const fiEl = document.getElementById("formulaInput");
  if(formulaInsertSource === "formulaBar" || document.activeElement === fiEl){
    const start = fiEl.selectionStart;
    const end = fiEl.selectionEnd;
    const before = fiEl.value.slice(0, start);
    const after = fiEl.value.slice(end);
    fiEl.value = before + text + after;
    const newPos = start + text.length;
    fiEl.setSelectionRange(newPos, newPos);
    fiEl.focus();
    return;
  }
  if(editingRef){
    const td = table.querySelector('td[data-ref="' + editingRef + '"]');
    if(td){
      const sel = window.getSelection();
      if(sel.rangeCount && td.contains(sel.anchorNode)){
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const textNode = document.createTextNode(text);
        range.insertNode(textNode);
        range.setStartAfter(textNode);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        td.textContent = (td.textContent || "") + text;
        const rng = document.createRange();
        rng.selectNodeContents(td);
        rng.collapse(false);
        const s = window.getSelection();
        s.removeAllRanges(); s.addRange(rng);
      }
      td.focus();
      fiEl.value = td.textContent;
    }
  }
}

/* ============================================================
   CLAVIER
   ============================================================ */
document.addEventListener("keydown", function(e){
  const t = e.target;
  const inEdit = editingRef !== null;
  const inFormula = t.id === "formulaInput";
  const inSearch = t.closest && t.closest("#searchBox");
  const ctrl = e.ctrlKey || e.metaKey;
  const shift = e.shiftKey;

  if(activeDropdownCell) return;

  if(inSearch){
    if(e.key === "Escape"){ closeSearch(); e.preventDefault(); }
    if(e.key === "Enter"){ if(shift) searchPrev(); else searchNext(); e.preventDefault(); }
    return;
  }

  if(inEdit){
    if(e.key === "Enter"){ e.preventDefault(); endEdit(true); move(0, shift ? -1 : 1); return; }
    if(e.key === "Escape"){ e.preventDefault(); endEdit(false); return; }
    if(e.key === "Tab"){ e.preventDefault(); endEdit(true); move(shift ? -1 : 1, 0); return; }
    return;
  }
  if(inFormula){
    if(e.key === "Enter" && !shift){ e.preventDefault(); commitFormula(); fi.blur(); move(0, 1); return; }
    if(e.key === "Tab"){ e.preventDefault(); commitFormula(); move(shift ? -1 : 1, 0); fi.focus(); return; }
    if(e.key === "Escape"){ e.preventDefault();
      const c = cells.get(currentRef);
      fi.value = c && c.v != null ? String(c.v) : "";
      formulaInsertMode = false;
      formulaRangeStart = null;
      fi.blur();
      return;
    }
    return;
  }
  if(t.tagName === "INPUT" || t.tagName === "TEXTAREA") return;
  if(t.closest && t.closest("#toolbar")) return;

  if(e.code === "Space" && (ctrl || shift)){
    e.preventDefault();
    const position = parseRef(currentRef);
    if(ctrl && shift){
      selectAllActive = true;
      selectedRows.clear(); selectedCols.clear(); selectedRowAnchor = null; multiSelected.clear();
    } else if(shift){
      if(position.r === 0){ showProtectionMessage(currentRef); return; }
      selectedRows.clear(); selectedRows.add(position.r);
      selectedRowAnchor = position.r;
      selectedAnchor = currentRef;
      selectedCols.clear(); selectAllActive = false; multiSelected.clear();
    } else {
      selectedCols.clear(); selectedCols.add(position.c);
      selectedRows.clear(); selectedRowAnchor = null; selectAllActive = false; multiSelected.clear();
    }
    render();
    return;
  }

  if(ctrl){
    const k = e.key.toLowerCase();
    if(k === "z" && !shift){ e.preventDefault(); undo(); return; }
    if(k === "y" || (k === "z" && shift)){ e.preventDefault(); redo(); return; }
    if(k === "b"){ e.preventDefault(); toggleStyle("b"); return; }
    if(k === "i"){ e.preventDefault(); toggleStyle("i"); return; }
    if(k === "u"){ e.preventDefault(); toggleStyle("u"); return; }
    if(k === "s"){ e.preventDefault(); saveLocal(); showToast("💾 Enregistré"); return; }
    if(k === "c"){ e.preventDefault(); doCopy(false); return; }
    if(k === "x"){ e.preventDefault();
      if(isProtectedCell(currentRef)){ showToast("🔒 Cellule protégée"); return; }
      doCopy(true); return;
    }
    if(k === "v"){ e.preventDefault(); doPaste(); return; }
    if(k === "a"){ e.preventDefault(); selectAllActive = true; selectedRows.clear(); selectedCols.clear(); multiSelected.clear(); render(); return; }
    if(k === "f"){ e.preventDefault(); openSearch(); return; }
    if(k === "d"){ e.preventDefault(); fillDownSelection(); return; }
    if(k === "r"){ e.preventDefault(); fillRightSelection(); return; }
    if(k === "home"){ e.preventDefault(); setCurrent("A1"); return; }
    if(k === "end"){ e.preventDefault(); goToLastCell(); return; }
    if(k === "l" && shift){ e.preventDefault(); toggleFilterCurrentCol(); return; }
    if(k === "+" || k === "="){ 
      e.preventDefault(); 
      const rows = selectedRows.size > 0 ? selectedRows.size : 1;
      const p = parseRef(currentRef);
      const at = selectedRows.size > 0 ? Math.min.apply(null, [...selectedRows]) : p.r;
      insertRow(at, rows);
      selectedRows.clear();
      return;
    }
    if(k === "-"){ 
      e.preventDefault(); 
      const rows = selectedRows.size > 0 ? selectedRows.size : 1;
      const p = parseRef(currentRef);
      const at = selectedRows.size > 0 ? Math.min.apply(null, [...selectedRows]) : p.r;
      deleteRow(at, rows);
      selectedRows.clear();
      return;
    }
    if(!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  }

  if((e.key === "F4" || (e.altKey && e.key === "ArrowDown"))){
    const p = parseRef(currentRef);
    const cfg = currentHeaders[p.c];
    if(cfg && cfg.type === "dropdown" && p.r > 0 && !isProtectedCell(currentRef)){
      e.preventDefault();
      const td = table.querySelector('td[data-ref="' + currentRef + '"]');
      if(td) openDropdown(td, p.c, p.r);
      return;
    }
  }

  switch(e.key){
    case "ArrowUp":
      e.preventDefault();
      if(ctrl) moveToEdge(0, -1, shift);
      else if(shift && selectedRows.size) extendSelectedRows(-1);
      else moveByVisibleRows(-1, shift);
      return;
    case "ArrowDown":
      e.preventDefault();
      if(ctrl) moveToEdge(0, 1, shift);
      else if(shift && selectedRows.size) extendSelectedRows(1);
      else moveByVisibleRows(1, shift);
      return;
    case "ArrowLeft":
      e.preventDefault();
      if(ctrl) moveToEdge(-1, 0, shift); else move(-1, 0, shift);
      return;
    case "ArrowRight":
      e.preventDefault();
      if(ctrl) moveToEdge(1, 0, shift); else move(1, 0, shift);
      return;
    case "Tab":
      e.preventDefault(); move(shift ? -1 : 1, 0); return;
    case "Enter":
      e.preventDefault();
      {
        const p = parseRef(currentRef);
        const cfg = currentHeaders[p.c];
        if(cfg && cfg.type === "dropdown" && p.r > 0 && !isProtectedCell(currentRef)){
          const td = table.querySelector('td[data-ref="' + currentRef + '"]');
          if(td) openDropdown(td, p.c, p.r);
          return;
        }
      }
      if(isProtectedCell(currentRef)){ showProtectionMessage(currentRef); return; }
      startEdit(currentRef); return;
    case "F2":
      e.preventDefault();
      if(isProtectedCell(currentRef)){ showProtectionMessage(currentRef); return; }
      startEdit(currentRef); return;
    case "Delete":
    case "Backspace":
      e.preventDefault(); deleteSelection(); return;
    case "Home":
      e.preventDefault();
      if(ctrl) setCurrent("A1");
      else setCurrent(refName(0, parseRef(currentRef).r));
      return;
    case "End":
      e.preventDefault();
      if(ctrl) goToLastCell();
      else {
        const p = parseRef(currentRef);
        let lastC = 0;
        for(let c = COLS - 1; c >= 0; c--){
          const v = evaluate(refName(c, p.r));
          if(v !== "" && v != null){ lastC = c; break; }
        }
        setCurrent(refName(lastC, p.r));
      }
      return;
    case "PageDown": e.preventDefault(); move(0, 20, shift); return;
    case "PageUp": e.preventDefault(); move(0, -20, shift); return;
    case "F5": e.preventDefault(); promptGoTo(); return;
    case "Escape":
      e.preventDefault();
      if(selectAllActive || selectedRows.size || selectedCols.size || multiSelected.size){
        selectedRows.clear(); selectedCols.clear(); selectedRowAnchor = null; selectAllActive = false; multiSelected.clear();
        render(); return;
      }
      closeDropdown(); closeFilterMenu(); closeSearch();
      return;
  }

  /* ✅ Saisie directe d'un caractère : ouvre le dropdown avec le caractère pré-rempli
     (comportement Excel : on peut aussi saisir librement dans un champ dropdown) */
  if(e.key.length === 1 && !ctrl && !e.altKey && !e.metaKey){
    e.preventDefault();
    if(selectAllActive || selectedRows.size || selectedCols.size) return;
    const p = parseRef(currentRef);
    const cfg = currentHeaders[p.c];
    if(cfg && cfg.type === "dropdown" && p.r > 0 && !isProtectedCell(currentRef)){
      const td = table.querySelector('td[data-ref="' + currentRef + '"]');
      if(td){
        openDropdown(td, p.c, p.r);
        setTimeout(function(){
          const searchInput = document.getElementById("ddSearch");
          if(searchInput){
            searchInput.value = e.key;
            searchInput.dispatchEvent(new Event("input"));
            searchInput.focus();
          }
        }, 30);
      }
      return;
    }
    if(isProtectedCell(currentRef)){ showProtectionMessage(currentRef); return; }
    startEdit(currentRef, e.key);
  }
}, true);

function goToLastCell(){
  let lastR = 0, lastC = 0;
  cells.forEach(function(cell, ref){
    if(cell && cell.v != null && cell.v !== ""){
      const p = parseRef(ref);
      if(p.r > lastR) lastR = p.r;
      if(p.c > lastC) lastC = p.c;
    }
  });
  setCurrent(refName(lastC, lastR));
}

function promptGoTo(){
  const ref = prompt("Aller à la cellule :", currentRef);
  if(ref && /^\$?[A-Z]+\$?\d+$/i.test(ref.trim())){
    setCurrent(ref.trim().toUpperCase());
  }
}

function fillDownSelection(){
  const rec = rect();
  if(rec.r1 === rec.r2){ showToast("Sélectionnez plusieurs lignes"); return }
  pushUndo();
  let skipped = 0;
  for(let c = rec.c1; c <= rec.c2; c++){
    const srcCell = cells.get(refName(c, rec.r1));
    for(let r = rec.r1 + 1; r <= rec.r2; r++){
      const targetRef = refName(c, r);
      if(isProtectedCell(targetRef)){ skipped++; continue; }
      if(!srcCell){ cells.delete(targetRef); continue }
      const newCell = JSON.parse(JSON.stringify(srcCell));
      if(newCell.v && String(newCell.v).charAt(0) === "=")
        newCell.v = shiftFormula(String(newCell.v), r - rec.r1, 0);
      cells.set(targetRef, newCell);
    }
  }
  invalidateAll(); saveLocal(); render();
  let msg = "📋 Recopié vers le bas (Ctrl+D)";
  if(skipped > 0) msg += " — " + skipped + " protégée(s)";
  showToast(msg);
}

function fillRightSelection(){
  const rec = rect();
  if(rec.c1 === rec.c2){ showToast("Sélectionnez plusieurs colonnes"); return }
  pushUndo();
  let skipped = 0;
  for(let r = rec.r1; r <= rec.r2; r++){
    const srcCell = cells.get(refName(rec.c1, r));
    for(let c = rec.c1 + 1; c <= rec.c2; c++){
      const targetRef = refName(c, r);
      if(isProtectedCell(targetRef)){ skipped++; continue; }
      if(!srcCell){ cells.delete(targetRef); continue }
      const newCell = JSON.parse(JSON.stringify(srcCell));
      if(newCell.v && String(newCell.v).charAt(0) === "=")
        newCell.v = shiftFormula(String(newCell.v), 0, c - rec.c1);
      cells.set(targetRef, newCell);
    }
  }
  invalidateAll(); saveLocal(); render();
  let msg = "📋 Recopié vers la droite (Ctrl+R)";
  if(skipped > 0) msg += " — " + skipped + " protégée(s)";
  showToast(msg);
}

  }

  else document.getElementById("formulaHint").classList.remove("show");
  updateHighlightedRefs();
  table.querySelectorAll("td").forEach(function(td){

    if(!ref) return;
    if(highlightedRefs.has(ref) && ref !== currentRef && ref !== editingRef){

      td.classList.remove("formula-ref");
    }

fi.addEventListener("blur", function(){
  setTimeout(function(){
    if(document.activeElement === fi) return;
    if(formulaInsertMode && document.activeElement && document.activeElement.closest && document.activeElement.closest("#grid")){
      return;
    }
    commitFormula();
    formulaInsertMode = false;
    formulaRangeStart = null;
  }, 50);
});

function commitFormula(){
  if(isProtectedCell(currentRef)){
    const c = cells.get(currentRef);
    fi.value = c && c.v != null ? String(c.v) : "";
    formulaInsertMode = false;
    formulaRangeStart = null;
    return;
  }
  const v = fi.value.trim();
  const oldCell = cells.get(currentRef);
  const oldVal = oldCell && oldCell.v != null ? String(oldCell.v) : "";
  if(v !== oldVal){
    pushUndo();
    const c = Object.assign({}, oldCell || {});
    if(v === "") delete c.v; else c.v = v;
    if(Object.keys(c).length === 0) cells.delete(currentRef);
    else cells.set(currentRef, c);
    const parsedRef = parseRef(currentRef);
    const ownerAssigned = v !== "" && parsedRef ? assignActiveOwnerToRow(parsedRef.r) : false;
    if(activeSheet().type === "colonne" && parsedRef && parsedRef.r >= ROWS - OWNER_EMPTY_ROWS){
      syncActiveSheetRefs();
    }
    invalidateAll();
    if(parsedRef) queueServerDeleteForEmptyRow(parsedRef.r);
    saveLocal();
    if(ownerAssigned) renderSheetTabs();
    render();
  }
  formulaInsertMode = false;
  formulaRangeStart = null;
}

let lastClickTime = 0;
let lastClickRef = null;

table.addEventListener("mousedown", function(e){
  const th = e.target.closest("th");
  if(!th) return;

  if(th.parentNode.tagName === "TR" && th.parentNode.parentNode.tagName === "TBODY" && th.dataset.row !== undefined){
    e.preventDefault();
    const rowIdx = parseInt(th.dataset.row, 10);
    const ctrl = e.ctrlKey || e.metaKey;
    const shift = e.shiftKey;
    const position = parseRef(currentRef);
    const anchor = selectedRowAnchor !== null
      ? selectedRowAnchor
      : (selectedRows.size > 0 ? Math.max.apply(null, [...selectedRows]) : position.r);

    if(shift){
      selectedRowAnchor = anchor;
      const from = Math.min(anchor, rowIdx);
      const to = Math.max(anchor, rowIdx);
      if(!ctrl) selectedRows.clear();
      for(let r = from; r <= to; r++) selectedRows.add(r);
    } else if(ctrl){
      if(selectedRows.has(rowIdx)) selectedRows.delete(rowIdx);
      else selectedRows.add(rowIdx);
      selectedRowAnchor = rowIdx;
    } else {
      selectedRows.clear();
      selectedRows.add(rowIdx);
      selectedRowAnchor = rowIdx;
    }
    currentRef = refName(position.c, rowIdx);
    selectedAnchor = refName(position.c, shift ? anchor : rowIdx);
    selectedCols.clear(); selectAllActive = false; multiSelected.clear();
    render();
    return;
  }

  if(th.parentNode.parentNode.tagName === "THEAD" && th.dataset.col !== undefined){
    e.preventDefault();
    const colIdx = parseInt(th.dataset.col, 10);
    const ctrl = e.ctrlKey || e.metaKey;
    const shift = e.shiftKey;

    if(shift && selectedCols.size > 0){
      const lastCol = Math.max.apply(null, [...selectedCols]);
      const from = Math.min(lastCol, colIdx);
      const to = Math.max(lastCol, colIdx);
      selectedCols.clear();
      for(let c = from; c <= to; c++) selectedCols.add(c);
    } else if(ctrl){
      if(selectedCols.has(colIdx)) selectedCols.delete(colIdx);
      else selectedCols.add(colIdx);
    } else {
      selectedCols.clear();
      selectedCols.add(colIdx);
    }
    selectedRows.clear(); selectAllActive = false; multiSelected.clear();
    render();
    return;
  }

  if(th.id === "cornerCell"){
    e.preventDefault();
    selectAllActive = !selectAllActive;
    if(!selectAllActive){ selectedRows.clear(); selectedCols.clear(); }
    multiSelected.clear();
    render();
    return;
  }
});

table.addEventListener("mousedown", function(e){
  if(e.target.closest("th")) return;
  if(e.target.classList.contains("filter-icon")) return;
  if(e.target.classList.contains("fill-handle")) return;
  if(e.target.closest("#dropdownMenu")) return;
  if(e.target.closest("#filterMenu")) return;
  const td = e.target.closest("td");
  if(!td) return;
  const clickedRef = td.dataset.ref;
  const p = parseRef(clickedRef);
  const shift = e.shiftKey;
  const ctrl = e.ctrlKey || e.metaKey;

  if(activeDropdownCell && activeDropdownCell.td !== td){
    if(Date.now() - dropdownOpeningTime > 200){
      closeDropdown();
    }
  }

  if(formulaInsertMode){
    e.preventDefault();
    e.stopPropagation();
    if(shift && formulaRangeStart){
      insertTextInFormula(formulaRangeStart + ":" + clickedRef);
      formulaRangeStart = null;
    } else {
      insertTextInFormula(clickedRef);
      formulaRangeStart = clickedRef;
    }
    return;
  }

  if(editingRef && clickedRef === editingRef) return;
  if(editingRef && clickedRef !== editingRef) endEdit(true);

  const now = Date.now();
  const isDoubleClick = (now - lastClickTime < 400) && (lastClickRef === clickedRef);
  lastClickTime = now; lastClickRef = clickedRef;

  if(isDataSheet(activeSheet()) && p.r > 0 && !isDoubleClick && !isProtectedCell(clickedRef)){
    const cfg = currentHeaders[p.c];
    if(cfg && cfg.type === "dropdown" && !ctrl && !shift){
      e.preventDefault();
      e.stopPropagation();
      if(activeDropdownCell && activeDropdownCell.td === td){
        closeDropdown();
      } else {
        setCurrent(clickedRef);
        const activeTd = table.querySelector('td[data-ref="' + clickedRef + '"]');
        if(activeTd) openDropdown(activeTd, p.c, p.r);
      }
      return;
    }
  }

  /* ✅ Double-clic sur une cellule dropdown → édition libre */
  if(isDoubleClick){
    e.preventDefault();
    setCurrent(clickedRef);
    if(isProtectedCell(clickedRef)){ showProtectionMessage(clickedRef); return; }
    /* Même pour les cellules dropdown, on ouvre l'édition libre */
    startEdit(clickedRef);
    return;
  }

  e.preventDefault();

  if(ctrl){
    if(clickedRef === currentRef) return;
    if(multiSelected.has(clickedRef)) multiSelected.delete(clickedRef);
    else multiSelected.add(clickedRef);
    render();
    return;
  }

  if(shift){
    currentRef = clickedRef;
    render();
    return;
  }

  selectedRows.clear(); selectedCols.clear(); selectAllActive = false;
  selectedRowAnchor = null;
  multiSelected.clear();
  currentRef = clickedRef;
  selectedAnchor = clickedRef;
  render();
  isMouseSelecting = true;
  document.addEventListener("mousemove", onCellMouseMove);
  document.addEventListener("mouseup", onCellMouseUp);
}, true);

function onCellMouseMove(e){
  if(!isMouseSelecting) return;
  const td = document.elementFromPoint(e.clientX, e.clientY);
  const targetTd = td && td.closest ? td.closest("td") : null;
  if(!targetTd) return;
  if(targetTd.dataset.ref === currentRef) return;
  currentRef = targetTd.dataset.ref;
  render();
}
function onCellMouseUp(){
  isMouseSelecting = false;
  document.removeEventListener("mousemove", onCellMouseMove);
  document.removeEventListener("mouseup", onCellMouseUp);
}

table.addEventListener("contextmenu", function(e){
  const td = e.target.closest("td");
  if(td){
    if(!editingRef){
      setCurrent(td.dataset.ref);
    }
    showContextMenu(e);
  } else if(e.target.closest("th")){
    e.preventDefault();
    const th = e.target.closest("th");
    if(th.dataset.row !== undefined){
      const rowIdx = parseInt(th.dataset.row, 10);
      selectedRows.clear(); selectedRows.add(rowIdx);
      selectedRowAnchor = rowIdx;

});

document.addEventListener("mousedown", function(e){

function exportCSV(){
  syncActiveSheetRefs();
  const sheet = activeSheet();
  const lines = [];
  const storedRows = new Set([0, ...getFilteredRows()]);
  for(const r of Array.from(storedRows).sort((a, b) => a - b)){
    const vals = [];
    let hasData = false;
    for(let c=0; c<COLS; c++){
      const v = evaluate(refName(c, r));
      const s = str(v).replace(/"/g, '""');
      if(s) hasData = true;
      vals.push('"' + s + '"');
    }
    if(hasData) lines.push(vals.join(";"));
  }
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tableur-" + sheet.name.replace(/\s/g, "_") + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("💾 Exporté");
}

function normalizeImportHeader(value){
  const normalized = String(value == null ? "" : value)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
  const aliases = {
    "date de reception physique": "date reception physique",
    "date envoi cdg": "date envoi dr"
  };
  return aliases[normalized] || normalized;
}

const IGNORED_IMPORT_HEADERS = new Set(["motif du da"]);

function getImportColumnMappings(sourceHeaders, targetHeaders){
  const targetByName = new Map();
  targetHeaders.forEach(function(header, index){
    const key = normalizeImportHeader(header && header.header);
    if(key && !targetByName.has(key)) targetByName.set(key, index);
  });
  const usedTargets = new Set();
  const mappings = [];
  sourceHeaders.forEach(function(header, sourceIndex){
    const targetIndex = targetByName.get(normalizeImportHeader(header));
    if(targetIndex === undefined || usedTargets.has(targetIndex)) return;
    usedTargets.add(targetIndex);
    mappings.push({sourceIndex, targetIndex});
  });
  return mappings;
}

function normalizeImportedApiValue(field, value, header, rowNumber, date1904){
  if(value === undefined || value === null || String(value).trim() === "") return null;
  const normalized = API_DATE_FIELDS.has(field)
    ? normalizeApiDate(value, date1904)
    : normalizeApiValue(field, value);
  const invalidDate = API_DATE_FIELDS.has(field) && normalized === null;
  const invalidNumber = API_NUMBER_FIELDS.has(field) && normalized === null;
  const invalidBoolean = (field === "cas_exceptionnel" || field === "budget_valide") && typeof normalized !== "boolean";
  if(invalidDate || invalidNumber || invalidBoolean){
    const shownValue = String(value).trim().slice(0, 80);
    throw new Error("Valeur invalide «" + shownValue + "» pour «" + header + "» à la ligne " + rowNumber + ".");
  }
  return normalized;
}

async function importSpreadsheet(file){
  try{
    if(typeof XLSX === "undefined") throw new Error("La bibliothèque Excel n'est pas chargée.");
    const isCsv = /\.csv$/i.test(file.name);
    const workbook = isCsv
      ? XLSX.read("\uFEFF" + await file.text(), {type: "string", codepage: 65001, cellDates: true})
      : XLSX.read(await file.arrayBuffer(), {type: "array", cellDates: true});
    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
    if(!worksheet) throw new Error("Le fichier ne contient aucune feuille.");
    const matrix = XLSX.utils.sheet_to_json(worksheet, {
      header: 1,
      defval: "",
      raw: false,
      blankrows: true,
      skipHidden: false
    });
    if(!matrix.length) throw new Error("Le fichier ne contient aucune donnée.");

    const sheet = activeSheet();
    if(isDataSheet(sheet)){
      const backendReady = await initializeBackendSync();
      if(!backendReady) throw new Error("Impossible de joindre la base de données. L'import n'a pas été enregistré.");
    }
    const sourceHeaders = matrix[0].map(value => String(value == null ? "" : value).trim());
    const hasTargetHeaders = Array.isArray(sheet.headers) && sheet.headers.length > 0;
    const targetHeaders = hasTargetHeaders
      ? sheet.headers
      : sourceHeaders.map(function(header, index){
        return {header: header || "Colonne " + (index + 1), type: "text", width: 130};
      });
    const mappings = getImportColumnMappings(sourceHeaders, targetHeaders);
    if(!mappings.length) throw new Error("Aucune colonne du fichier ne correspond aux en-têtes de la feuille active.");
    const sourceRows = matrix.slice(1)
      .map((values, index) => ({values, rowNumber: index + 2}))
    const blankRows = sourceRows.filter(item =>
      !Array.isArray(item.values) || !item.values.some(value => value !== "" && value !== null && value !== undefined)
    );
    const importedRows = sourceRows.filter(item => !blankRows.includes(item));
    if(!importedRows.length) throw new Error("Le fichier ne contient aucune ligne à importer.");
    if(blankRows.length){
      const shownRows = blankRows.slice(0, 20).map(item => item.rowNumber).join(", ");
      const extraRows = blankRows.length > 20 ? " et " + (blankRows.length - 20) + " autre(s)" : "";
      const proceed = window.confirm(
        "Le fichier contient " + sourceRows.length + " ligne(s) après l'en-tête, dont " +
        blankRows.length + " ligne(s) entièrement vide(s) (ligne(s) Excel " + shownRows + extraRows +
        "). Les lignes vides ne peuvent pas créer de fiche d'achat et seront ignorées. Continuer avec les " +
        importedRows.length + " lignes non vides ?"
      );
      if(!proceed) return;
    }

    let added = 0;
    let updated = 0;
    let preparedRows = null;
    if(isDataSheet(sheet)){
      const columns = getApiColumns(sheet);
      const columnByIndex = new Map(columns.map(column => [column.col, column]));
      const fieldMappings = mappings.map(function(mapping){
        return {sourceIndex: mapping.sourceIndex, column: columnByIndex.get(mapping.targetIndex)};
      }).filter(mapping => mapping.column && !API_CALCULATED_FIELDS.has(mapping.column.field));
      if(!fieldMappings.length) throw new Error("Aucune colonne modifiable ne correspond au fichier.");
      const mappedSourceIndexes = new Set(mappings.map(mapping => mapping.sourceIndex));
      const ignoredHeaders = sourceHeaders.filter(function(header, sourceIndex){
        if(mappedSourceIndexes.has(sourceIndex)) return false;
        if(IGNORED_IMPORT_HEADERS.has(normalizeImportHeader(header))) return false;
        return importedRows.some(item => {
          const value = item.values[sourceIndex];
          return value !== "" && value !== null && value !== undefined;
        });
      });
      if(ignoredHeaders.length){
        throw new Error("Colonnes contenant des données mais non reconnues : " + ignoredHeaders.join(", ") + ". Vérifiez les en-têtes du fichier.");
      }

      const existingRows = getPopulatedApiRows(sheet, columns);
      let nextRow = existingRows.reduce((lastRow, row) => Math.max(lastRow, row), 0) + 1;
      preparedRows = importedRows.map(function(item){
        const values = item.values;
        const importedRecord = {};
        let hasValues = false;
        fieldMappings.forEach(function(mapping){
          const sourceValue = values[mapping.sourceIndex];
          const normalizedValue = normalizeImportedApiValue(
            mapping.column.field,
            sourceValue,
            sourceHeaders[mapping.sourceIndex] || mapping.column.header,
            item.rowNumber,
            Boolean(workbook.Workbook && workbook.Workbook.WBProps && workbook.Workbook.WBProps.date1904)
          );
          if(sourceValue !== undefined && sourceValue !== null && String(sourceValue).trim() !== "") hasValues = true;
          importedRecord[mapping.column.field] = normalizedValue;
        });
        if(!hasValues){
          throw new Error("La ligne " + item.rowNumber + " contient des données, mais aucune valeur dans une colonne enregistrable.");
        }

        if(nextRow >= EXCEL_MAX_ROWS) throw new Error("La feuille a atteint sa limite de lignes.");
        return {importedRecord, row: nextRow++, rowNumber: item.rowNumber};
      });
      if(preparedRows.length !== importedRows.length){
        throw new Error("Toutes les lignes non vides du fichier n'ont pas été préparées pour l'import.");
      }
    }

    pushUndo();
    if(!hasTargetHeaders){
      sheet.headers = targetHeaders;
      targetHeaders.forEach(function(header, column){
        sheet.cells.set(refName(column, 0), {v: header.header, s: {b: true}});
      });
    }

    if(isDataSheet(sheet)){
      const columns = getApiColumns(sheet);
      sheet.rows = EXCEL_MAX_ROWS;
      preparedRows.forEach(function(item){
        const row = item.row;
        setSheetApiRecord(sheet, row, item.importedRecord, columns);
        const markerColumn = columns.find(column => column.field === "numero_da") || columns[0];
        if(markerColumn){
          const markerRef = refName(markerColumn.col, row);
          const markerCell = Object.assign({}, sheet.cells.get(markerRef) || {});
          markerCell._allowDuplicateNumeroDa = true;
          sheet.cells.set(markerRef, markerCell);
        }
        added++;
      });
    } else {
      const existingRows = Array.from(new Set(Array.from(sheet.cells.keys())
        .map(ref => parseRef(ref))
        .filter(position => position && position.r > 0)
        .map(position => position.r)));
      let nextRow = existingRows.reduce((lastRow, row) => Math.max(lastRow, row), 0) + 1;
      importedRows.forEach(function(item){
        const values = item.values;
        const hasValues = mappings.some(mapping => values[mapping.sourceIndex] !== "" && values[mapping.sourceIndex] != null);
        if(!hasValues){
          throw new Error("La ligne " + item.rowNumber + " contient des données, mais aucune valeur correspondant aux en-têtes de la feuille.");
        }
        const row = nextRow++;
        mappings.forEach(function(mapping){
          const value = values[mapping.sourceIndex];
          if(value === "" || value == null) return;
          sheet.cells.set(refName(mapping.targetIndex, row), {v: value});
        });
        added++;
      });
    }
    if(isDataSheet(sheet) && added + updated !== importedRows.length){
      throw new Error("Import incomplet : " + (added + updated) + " ligne(s) traitée(s) sur " + importedRows.length + ".");
    }

    sheet.rows = getSheetRowCapacity(sheet);
    syncActiveSheetRefs();
    invalidateAll();
    buildGrid();
    renderSheetTabs();
    render();
    saveLocal();
    if(isDataSheet(sheet) && !await syncTableurWithBackend()){
      throw new Error("La synchronisation avec la base de données a échoué. L'import reste en attente et n'est pas confirmé.");
    }
    const blankSummary = blankRows.length
      ? ", " + blankRows.length + " ligne(s) vide(s) ignorée(s)"
      : "";
    showToast(
      "Import terminé : " + (added + updated) + "/" + sourceRows.length +
      " ligne(s) non vide(s) traitée(s), " + added + " ajouté(s), " + updated +
      " mis à jour" + blankSummary
    );
  }catch(error){
    console.error("Import du fichier impossible:", error);
    showToast(error.message || "Import du fichier impossible");
  }
}

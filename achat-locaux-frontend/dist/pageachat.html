function scheduleBackendRetry(action){
  if(backendRetryTimer) return;
  const delay = Math.min(60000, 3000 * Math.pow(2, Math.min(backendRetryAttempt, 5)));
  backendRetryAttempt++;
  backendRetryTimer = setTimeout(function(){
    backendRetryTimer = null;
    action();
  }, delay);
}

function clearBackendRetry(){
  backendRetryAttempt = 0;
  if(backendRetryTimer){
    clearTimeout(backendRetryTimer);
    backendRetryTimer = null;
  }
}

function getBackendSyncError(error){
  const rawMessage = String(error && error.message ? error.message : "Erreur inconnue");
  const httpMatch = /^HTTP\s+(\d+)\s+-\s*([\s\S]*)$/.exec(rawMessage);
  let detail = httpMatch ? httpMatch[2] : rawMessage;
  try{
    const body = JSON.parse(detail);
    if(body && body.error) detail = String(body.error);
  }catch(e){}
  const isNetworkError = !httpMatch && /fetch|network|réseau/i.test(rawMessage);
  const message = httpMatch
    ? "Erreur " + httpMatch[1] + ": " + detail
    : (isNetworkError ? "Erreur réseau: " : "Erreur de synchronisation: ") + detail;
  return {message, statusCode: httpMatch ? Number(httpMatch[1]) : null};
}

function getApiColumns(sheet){
  const headerColumns = new Map();
  const maxCols = Math.max((sheet.headers || []).length, COLS);
  for(let c = 0; c < maxCols; c++){
    const cell = sheet.cells.get(refName(c, 0));
    const header = String(cell && cell.v != null ? cell.v : "").trim();
    if(!header) continue;
    if(!headerColumns.has(header)) headerColumns.set(header, []);
    headerColumns.get(header).push(c);
  }
  const visibleColumns = API_COLUMN_DEFS.map(function(def){
    const names = [def[0], ...(API_COLUMN_HEADER_ALIASES[def[1]] || [])];
    const col = names.map(name => (headerColumns.get(name) || [])[0]).find(Number.isInteger);
    return {header: def[0], field: def[1], col};
  }).filter(column => Number.isInteger(column.col));
  const hiddenColumns = HIDDEN_API_COLUMN_DEFS.map(function(def, index){
    const legacyCol = (headerColumns.get(def[0]) || [])[0];
    return {
      header: def[0],
      field: def[1],
      col: Number.isInteger(legacyCol) ? legacyCol : COLONNE_HEADERS.length + index,
      hidden: true
    };
  });
  return [...visibleColumns, ...hiddenColumns];
}

function ensureBudgetStatusFormula(sheet, row, columns){
  const columnByField = new Map(columns.map(column => [column.field, column.col]));
  const budgetCol = columnByField.get("montant_budget");
  const priceCol = columnByField.get("prix_unitaire");
  const quantityCol = columnByField.get("quantite");
  const statusCol = columnByField.get("statut_budget");
  if(![budgetCol, priceCol, quantityCol, statusCol].every(Number.isInteger)) return false;

  const budgetRef = refName(budgetCol, row);
  const priceRef = refName(priceCol, row);
  const quantityRef = refName(quantityCol, row);
  const statusRef = refName(statusCol, row);
  const hasInput = [budgetRef, priceRef, quantityRef].some(ref => {
    const value = sheet.cells.get(ref)?.v;
    return value !== undefined && value !== null && value !== "";
  });
  if(!hasInput) return false;

  const formula = `=IF(${budgetRef}="","",IF(${priceRef}="","",IF(${quantityRef}="","",IF(${budgetRef}>=${priceRef}*${quantityRef},"✅ Budget Conforme",IF(${budgetRef}=0,"⛔ Hors budget","↗️ Dépassement")))))`;
  const cell = Object.assign({}, sheet.cells.get(statusRef) || {});
  if(cell.v === formula) return false;
  cell.v = formula;
  sheet.cells.set(statusRef, cell);
  return true;
}

function normalizeApiDate(value, date1904 = false){
  if(value === null || value === undefined || value === "") return null;
  if(value instanceof Date){
    if(!Number.isFinite(value.getTime()) || value.getFullYear() < 1 || value.getFullYear() > 9999) return null;
    return String(value.getFullYear()).padStart(4, "0") + "-" + String(value.getMonth() + 1).padStart(2, "0") + "-" + String(value.getDate()).padStart(2, "0");
  }
  const text = String(value).trim();
  if(/^\d+(?:\.\d+)?$/.test(text)){
    const serial = Number(text);
    const maxSerial = date1904 ? 2957003 : 2958465;
    if(serial >= 0 && serial <= maxSerial){
      const date = new Date(Date.UTC(date1904 ? 1904 : 1899, date1904 ? 0 : 11, date1904 ? 1 : 30) + Math.floor(serial) * 86400000);
      const year = date.getUTCFullYear();
      if(year >= 1 && year <= 9999){
        return String(year).padStart(4, "0") + "-" + String(date.getUTCMonth() + 1).padStart(2, "0") + "-" + String(date.getUTCDate()).padStart(2, "0");
      }
    }
    return null;
  }
  let year, month, day;
  let dayFirstMatch = null;
  let match = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:[ T]\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?(?:Z|[+-]\d{2}:?\d{2})?)?$/.exec(text);
  if(match){
    dayFirstMatch = match;
    year = Number(match[3].length === 2 ? "20" + match[3] : match[3]);
    month = Number(match[2]);
    day = Number(match[1]);
  } else {
    match = /^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})(?:$|[ T]\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?(?:Z|[+-]\d{2}:?\d{2})?)$/.exec(text);
    if(!match) return null;
    year = Number(match[1]);
    month = Number(match[2]);
    day = Number(match[3]);
  }
  const isValidDateParts = (candidateYear, candidateMonth, candidateDay) => {
    if(candidateYear < 1 || candidateYear > 9999 || candidateMonth < 1 || candidateMonth > 12 || candidateDay < 1 || candidateDay > 31) return false;
    const date = new Date(0);
    date.setUTCFullYear(candidateYear, candidateMonth - 1, candidateDay);
    return date.getUTCFullYear() === candidateYear &&
      date.getUTCMonth() === candidateMonth - 1 &&
      date.getUTCDate() === candidateDay;
  };
  if(!isValidDateParts(year, month, day)){
    const monthFirstYear = dayFirstMatch
      ? Number(dayFirstMatch[3].length === 2 ? "20" + dayFirstMatch[3] : dayFirstMatch[3])
      : null;
    const monthFirstMonth = dayFirstMatch ? Number(dayFirstMatch[1]) : null;
    const monthFirstDay = dayFirstMatch ? Number(dayFirstMatch[2]) : null;
    if(!dayFirstMatch || !isValidDateParts(monthFirstYear, monthFirstMonth, monthFirstDay)) return null;
    year = monthFirstYear;
    month = monthFirstMonth;
    day = monthFirstDay;
  }
  return String(year).padStart(4, "0") + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function displayApiDate(value){
  const iso = normalizeApiDate(value);
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return value == null ? "" : String(value);
  return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);
}

function normalizeApiValue(field, value){
  if(value === undefined || value === null || String(value).trim() === "") return null;
  if(API_DATE_FIELDS.has(field)) return normalizeApiDate(value);
  if(API_NUMBER_FIELDS.has(field)){
    const number = Number(String(value).replace(/\s/g, "").replace(",", "."));
    return Number.isFinite(number) ? number : null;
  }
  if(field === "cas_exceptionnel" || field === "budget_valide"){
    const text = String(value).trim().toLowerCase();
    if(["true", "t", "1", "oui", "o", "yes", "y"].includes(text)) return true;
    if(["false", "f", "0", "non", "n", "no"].includes(text)) return false;
  }
  return typeof value === "string" ? value.trim() : value;
}

function apiRecordFromSheet(sheet, row, columns){
  const record = {};
  columns.forEach(function(column){
    const cell = sheet.cells.get(refName(column.col, row));
    record[column.field] = normalizeApiValue(column.field, cell && cell.v != null ? cell.v : null);
  });
  const number = field => {
    const value = record[field];
    return value === null ? null : Number(value);
  };
  const price = number("prix_unitaire"), reference = number("prix_reference"), quantity = number("quantite");
  const budget = number("montant_budget");
  record.montant_ht = price !== null && quantity !== null ? price * quantity : null;
  record.gain_achat = price !== null && reference !== null && quantity !== null ? (reference - price) * quantity : null;
  record.ecart_pourcentage = price !== null && reference ? (price - reference) / reference : null;
  record.ecart_budget = budget !== null && record.montant_ht !== null ? budget - record.montant_ht : null;
  record.statut_budget = budget === null || record.montant_ht === null
    ? null
    : budget >= record.montant_ht
      ? "✅ Budget Conforme"
      : budget === 0
        ? "⛔ Hors budget"
        : "↗️ Dépassement";
  return record;
}

function apiRecordFingerprint(record){
  return JSON.stringify(API_COLUMN_DEFS
    .filter(def => !API_CALCULATED_FIELDS.has(def[1]))
    .map(def => [def[1], normalizeApiValue(def[1], record[def[1]])]));
}

function getRowServerId(sheet, row, columns){
  for(const column of columns){
    const id = sheet.cells.get(refName(column.col, row))?._serverId;
    if(id !== undefined && id !== null && id !== "") return String(id);
  }
  const firstCell = sheet.cells.get(refName(0, row));
  return firstCell && firstCell._serverId != null ? String(firstCell._serverId) : null;
}

function getPopulatedApiRows(sheet, columns){
  const apiColumns = new Set(columns.map(column => column.col));
  const rows = new Set();
  sheet.cells.forEach(function(cell, ref){
    const position = parseRef(ref);
    if(!position || position.r < 1 || !apiColumns.has(position.c) || !cell) return;
    if((cell.v !== undefined && cell.v !== null && cell.v !== "") || cell._serverId !== undefined){
      rows.add(position.r);
    }
  });
  return Array.from(rows).sort((a, b) => a - b);
}

function clearServerMetadata(cell){
  delete cell._serverId;
  delete cell._localBaseline;
  delete cell._serverFingerprint;
  return cell;
}

function queueServerDeleteForEmptyRow(row){
  const sheet = isDataSheet(activeSheet()) ? activeSheet() : sheets.find(item => item.type === "colonne");
  if(!sheet) return;
  const columns = getApiColumns(sheet);
  const serverId = getRowServerId(sheet, row, columns);
  if(serverId && isApiRecordEmpty(apiRecordFromSheet(sheet, row, columns))) pendingServerDeletes.add(serverId);
}

function reconcilePendingServerDeletes(){
  const sheet = sheets.find(item => item.type === "colonne");
  if(!sheet || !pendingServerDeletes.size) return;
  const columns = getApiColumns(sheet);
  const liveIds = new Set();
  for(const row of getPopulatedApiRows(sheet, columns)){
    const id = getRowServerId(sheet, row, columns);
    if(id) liveIds.add(id);
  }
  pendingServerDeletes.forEach(id => {
    if(liveIds.has(id)) pendingServerDeletes.delete(id);
  });
}

function setRowServerMetadata(sheet, row, columns, id, fingerprint, serverFingerprint){
  const metaColumn = columns.find(column => column.field === "numero_da")?.col ?? columns[0]?.col ?? 0;
  columns.forEach(function(column){
    if(column.col === metaColumn) return;
    const ref = refName(column.col, row);
    const cell = sheet.cells.get(ref);
    if(!cell) return;
    const cleaned = Object.assign({}, cell);
    delete cleaned._serverId;
    delete cleaned._localBaseline;
    delete cleaned._serverFingerprint;
    sheet.cells.set(ref, cleaned);
  });
  const ref = refName(metaColumn, row);
  const cell = Object.assign({}, sheet.cells.get(ref) || {});
  cell._serverId = id;
  if(fingerprint !== undefined) cell._localBaseline = fingerprint;
  if(serverFingerprint !== undefined) cell._serverFingerprint = serverFingerprint;
  sheet.cells.set(ref, cell);
}

function setSheetApiRecord(sheet, row, record, columns){
  const columnByField = new Map(columns.map(column => [column.field, column.col]));
  const values = {...record};
  const price = Number(values.prix_unitaire), reference = Number(values.prix_reference);
  const quantity = Number(values.quantite), budget = Number(values.montant_budget);
  const rowNumber = row + 1;
  const fieldRef = field => Number.isInteger(columnByField.get(field)) ? colName(columnByField.get(field)) + rowNumber : null;
  const budgetRef = fieldRef("montant_budget"), amountRef = fieldRef("montant_ht");
  const priceRef = fieldRef("prix_unitaire"), referenceRef = fieldRef("prix_reference");
  const quantityRef = fieldRef("quantite");
  const formulaByField = {
    ecart_budget: budgetRef && amountRef ? "=" + budgetRef + "-" + amountRef : null,
    ecart_pourcentage: priceRef && referenceRef ? "=IF(" + referenceRef + "=\"\",\"\",IF(" + referenceRef + "=0,\"\",(" + priceRef + "-" + referenceRef + ")/" + referenceRef + "))" : null,
    montant_ht: priceRef && quantityRef ? "=" + priceRef + "*" + quantityRef : null,
    gain_achat: priceRef && referenceRef && quantityRef ? "=(" + referenceRef + "-" + priceRef + ")*" + quantityRef : null,
    statut_budget: budgetRef && priceRef && quantityRef
      ? `=IF(${budgetRef}=\"\",\"\",IF(${priceRef}=\"\",\"\",IF(${quantityRef}=\"\",\"\",IF(${budgetRef}>=${priceRef}*${quantityRef},\"✅ Budget Conforme\",IF(${budgetRef}=0,\"⛔ Hors budget\",\"↗️ Dépassement\")))))`
      : null
  };
  columns.forEach(function(column){
    const ref = refName(column.col, row);
    const cell = Object.assign({}, sheet.cells.get(ref) || {});
    let value = values[column.field];
    if(API_CALCULATED_FIELDS.has(column.field)){
      if(column.field === "montant_ht") value = Number.isFinite(price) && Number.isFinite(quantity) ? price * quantity : null;
      else if(column.field === "gain_achat") value = Number.isFinite(price) && Number.isFinite(reference) && Number.isFinite(quantity) ? (reference - price) * quantity : null;
      else if(column.field === "ecart_pourcentage") value = Number.isFinite(price) && Number.isFinite(reference) && reference !== 0 ? (price - reference) / reference : null;
      else if(column.field === "statut_budget") value = record.statut_budget ?? null;
      else value = Number.isFinite(budget) && Number.isFinite(price) && Number.isFinite(quantity) ? budget - price * quantity : null;
      if(formulaByField[column.field]) value = formulaByField[column.field];
    } else if(API_DATE_FIELDS.has(column.field)) value = displayApiDate(value);
    else if(column.field === "cas_exceptionnel" || column.field === "budget_valide") {
      value = value === true ? "Oui" : value === false ? "Non" : "";
    }
    if(value === null || value === undefined || value === "") delete cell.v;
    else cell.v = value;
    sheet.cells.set(ref, cell);
  });
  if(record.id !== undefined && record.id !== null) {
    setRowServerMetadata(sheet, row, columns, record.id, undefined, apiRecordFingerprint(record));
  }
}

function ensureCommitteeSheets(sourceSheet = sheets.find(item => item.type === "colonne")){

  COMMITTEE_SHEET_DEFS.forEach(function(def){

function syncAllSheetRecords(records, deletedIds = [], preserveLocalChanges = false, replaceMissingServerRows = false){
  const sourceSheet = sheets.find(item => item.type === "colonne");
  if(!sourceSheet) return;
  const allSheet = ensureAllSheet(sourceSheet);
  allSheet.rows = EXCEL_MAX_ROWS;
  const columns = getApiColumns(sourceSheet);
  const existingRows = getPopulatedApiRows(allSheet, columns);
  const occupiedRows = new Set(existingRows);
  const rowByServerId = new Map();
  const cellsByRow = indexSheetCellsByRow(allSheet);
  let nextFreeRow = 1;
  existingRows.forEach(function(row){
    const id = getRowServerId(allSheet, row, columns);
    if(id && !rowByServerId.has(id)) rowByServerId.set(id, row);
  });
  const removeRow = row => {
    const id = getRowServerId(allSheet, row, columns);
    deleteIndexedSheetRow(allSheet, cellsByRow, row);
    occupiedRows.delete(row);
    if(id) rowByServerId.delete(id);
  };
  const claimRow = () => {
    while(occupiedRows.has(nextFreeRow)) nextFreeRow++;
    if(nextFreeRow >= allSheet.rows) return undefined;
    const row = nextFreeRow++;
    occupiedRows.add(row);
    return row;
  };

  deletedIds.forEach(id => {
    const row = rowByServerId.get(String(id));
    if(row !== undefined) removeRow(row);
  });

  const incomingRecords = Array.isArray(records) ? records : [];
  const incomingIds = new Set(incomingRecords
    .filter(record => record && record.id !== undefined && record.id !== null)
    .map(record => String(record.id)));
  if(replaceMissingServerRows){
    existingRows.forEach(function(row){
      const id = getRowServerId(allSheet, row, columns);
      if(id && !incomingIds.has(id)) removeRow(row);
    });
  }

  incomingRecords.forEach(function(record){
    if(record?.id === undefined || record?.id === null) return;
    const id = String(record.id);
    let row = rowByServerId.get(id);
    if(row === undefined) row = claimRow();
    if(row === undefined) return;

    const localRecord = apiRecordFromSheet(allSheet, row, columns);
    const markerColumn = columns.find(column => column.field === "numero_da") || columns[0];
    const marker = markerColumn && allSheet.cells.get(refName(markerColumn.col, row));
    const localBaseline = marker && (marker._localBaseline || marker._serverFingerprint);
    const hasLocalChanges = preserveLocalChanges && localBaseline &&
      apiRecordFingerprint(localRecord) !== localBaseline;
    if(hasLocalChanges){
      setRowServerMetadata(allSheet, row, columns, record.id, undefined, apiRecordFingerprint(record));
    } else {
      setSheetApiRecord(allSheet, row, record, columns);
      const fingerprint = apiRecordFingerprint(record);
      setRowServerMetadata(allSheet, row, columns, record.id, fingerprint, fingerprint);
    }
    rowByServerId.set(id, row);
    occupiedRows.add(row);
    cellsByRow.set(row, columns.map(column => {
      const ref = refName(column.col, row);
      return [ref, allSheet.cells.get(ref)];
    }).filter(([, cell]) => cell));
  });

  allSheet.rows = getSheetRowCapacity(allSheet);
  renderSheetTabs();
  if(activeSheet() === allSheet){
    syncActiveSheetRefs();
    invalidateAll();
    buildGrid();
    render();
  }
}

function indexSheetCellsByRow(sheet){
  const cellsByRow = new Map();
  sheet.cells.forEach(function(cell, ref){
    const position = parseRef(ref);
    if(!position || position.r === 0) return;
    if(!cellsByRow.has(position.r)) cellsByRow.set(position.r, []);
    cellsByRow.get(position.r).push([ref, cell]);
  });
  return cellsByRow;
}

function deleteIndexedSheetRow(sheet, cellsByRow, row){
  (cellsByRow.get(row) || []).forEach(([ref]) => sheet.cells.delete(ref));
  cellsByRow.delete(row);
}

function compactInProgressSheet(sheet, columns){
  const rows = getPopulatedApiRows(sheet, columns).filter(function(row){
    const record = apiRecordFromSheet(sheet, row, columns);
    return getRowServerId(sheet, row, columns) || !isApiRecordEmpty(record);
  });
  const cellsByRow = indexSheetCellsByRow(sheet);
  let changed = false;

  rows.forEach(function(sourceRow, index){
    const targetRow = index + 1;
    if(sourceRow === targetRow) return;

    const sourceCells = cellsByRow.get(sourceRow) || [];
    deleteIndexedSheetRow(sheet, cellsByRow, sourceRow);
    deleteIndexedSheetRow(sheet, cellsByRow, targetRow);
    const movedCells = [];
    sourceCells.forEach(function(entry){
      const position = parseRef(entry[0]);
      const cell = Object.assign({}, entry[1]);
      if(typeof cell.v === "string" && cell.v.charAt(0) === "=") {
        cell.v = shiftFormula(cell.v, targetRow - sourceRow, 0);
      }
      const ref = refName(position.c, targetRow);
      sheet.cells.set(ref, cell);
      movedCells.push([ref, cell]);
    });
    cellsByRow.set(targetRow, movedCells);
    changed = true;
  });

  return changed;
}

async function loadApiRowsIntoSheet(rows){
  const sheetIndex = sheets.findIndex(sheet => sheet.type === "colonne");
  if(sheetIndex < 0) return;
  const sheet = sheets[sheetIndex];
  sheet.rows = EXCEL_MAX_ROWS;
  const columns = getApiColumns(sheet);
  const localRowsById = new Map();
  const localRowsByDa = new Map();
  const emptyRows = [];
  const occupiedRows = new Set(getPopulatedApiRows(sheet, columns));
  for(const row of occupiedRows){
    const serverId = getRowServerId(sheet, row, columns);
    if(serverId && !localRowsById.has(serverId)) localRowsById.set(serverId, row);
    const record = apiRecordFromSheet(sheet, row, columns);
    const da = String(record.numero_da || "").trim().toLowerCase();
    if(da){
      if(!localRowsByDa.has(da)) localRowsByDa.set(da, []);
      localRowsByDa.get(da).push(row);
    } else if(isApiRecordEmpty(record)) emptyRows.push(row);
  }
  backendRowsById = new Map();
  const inProgressIds = new Set();
  const claimedRows = new Set();
  let nextEmptyRow = 0;
  let nextFreeRow = 1;
  const claimEmptyRow = () => {
    while(nextEmptyRow < emptyRows.length && claimedRows.has(emptyRows[nextEmptyRow])) nextEmptyRow++;
    if(nextEmptyRow < emptyRows.length) return emptyRows[nextEmptyRow++];
    while(occupiedRows.has(nextFreeRow) || claimedRows.has(nextFreeRow)) nextFreeRow++;
    if(nextFreeRow >= sheet.rows) return null;
    const row = nextFreeRow++;
    occupiedRows.add(row);
    return row;
  };
  rows.forEach(function(record){
    if(record.id === undefined || record.id === null) return;
    backendRowsById.set(String(record.id), record);
    if(isDeliveredAchat(record)) return;
    inProgressIds.add(String(record.id));
    let targetRow = localRowsById.get(String(record.id));
    const da = String(record.numero_da || "").trim().toLowerCase();
    if(targetRow === undefined && da && localRowsByDa.has(da)){
      targetRow = localRowsByDa.get(da).find(row => !claimedRows.has(row));
    }
    if(targetRow === undefined) targetRow = claimEmptyRow();
    if(targetRow === null) return;
    claimedRows.add(targetRow);
    const localRecord = apiRecordFromSheet(sheet, targetRow, columns);
    const metadataCell = columns.map(column => sheet.cells.get(refName(column.col, targetRow))).find(cell => cell && (cell._serverFingerprint || cell._localBaseline));
    const localBaseline = metadataCell && (metadataCell._serverFingerprint || metadataCell._localBaseline);
    const hasLocalChanges = localBaseline && apiRecordFingerprint(localRecord) !== localBaseline;
    if(hasLocalChanges){
      setRowServerMetadata(sheet, targetRow, columns, record.id, undefined, apiRecordFingerprint(record));
    } else {
      setSheetApiRecord(sheet, targetRow, record, columns);
    }
  });
  syncDeliveredSheet(rows);
  syncCommitteeSheets(rows);
  for(const row of Array.from(occupiedRows)){
    const serverId = getRowServerId(sheet, row, columns);
    if(!serverId || inProgressIds.has(String(serverId))) continue;
    for(const ref of Array.from(sheet.cells.keys())){
      const position = parseRef(ref);
      if(position && position.r === row) sheet.cells.delete(ref);
    }
    pendingServerDeletes.delete(String(serverId));
  }
  pendingServerDeletes.forEach(id => {
    if(!backendRowsById.has(String(id))) pendingServerDeletes.delete(String(id));
  });
  for(const row of getPopulatedApiRows(sheet, columns)){
    if(getRowServerId(sheet, row, columns)) continue;
    const record = apiRecordFromSheet(sheet, row, columns);
    if(!isApiRecordEmpty(record)) setRowServerMetadata(sheet, row, columns, null, apiRecordFingerprint(record));
  }
  sheet.rows = getSheetRowCapacity(sheet);
  syncAllSheetRecords(rows, [], true, true);
  if(rows.length && activeSheet().type === "parametres") activeSheetIdx = sheetIndex;
  if(sheetIndex === activeSheetIdx){
    syncActiveSheetRefs();
    invalidateAll();
    scrollToOwnerEntryRows();
    buildGrid();
    renderSheetTabs();
    render();
  }
  backendSyncReady = true;
  saveLocal();
}

async function initializeBackendSync(){
  if(backendSyncReady) return true;
  if(backendInitPromise) return backendInitPromise;
  const token = localStorage.getItem("authToken");
  if(!token) return false;
  backendInitRunning = true;
  backendInitPromise = (async function(){
    try{
      const apiUrl = typeof window.apiUrl === "function" ? window.apiUrl : path => path;
      const response = await fetch(apiUrl("/api/achats?limit=all"), {
        headers: {Authorization: "Bearer " + token}, cache: "no-store"
      });
      if(!response.ok) throw new Error("HTTP " + response.status);
      const rows = await response.json();
      if(!Array.isArray(rows)) throw new Error("Réponse API invalide");
      await loadApiRowsIntoSheet(rows);
      focusOwnerDataAfterLoad();
      clearBackendRetry();
      return true;
    }catch(error){
      const status = document.getElementById("saveStatus");
      if(status) status.className = "error";
      document.getElementById("saveText").textContent = "API indisponible, sauvegarde locale conservée";
      console.warn("Synchronisation initiale des achats impossible:", error);
      if(!/^HTTP 4\d\d/.test(String(error.message || ""))) scheduleBackendRetry(initializeBackendSync);
      return false;
    }finally{
      backendInitRunning = false;
      backendInitPromise = null;
    }
  })();
  return backendInitPromise;
}

async function syncTableurWithBackend(){
  if(!backendSyncReady) return false;
  if(backendSyncRunning){
    backendSyncPending = true;
    return new Promise(resolve => backendSyncWaiters.push(resolve));
  }
  const token = localStorage.getItem("authToken");
  if(!token) return;
  backendSyncRunning = true;
  const status = document.getElementById("saveStatus");
  if(status) status.className = "saving";
  document.getElementById("saveText").textContent = "Synchronisation…";
  try{
    const sheet = isDataSheet(activeSheet()) ? activeSheet() : sheets.find(item => item.type === "colonne");
    if(!sheet) return;
    const columns = getApiColumns(sheet);
    const inserts = [], insertRows = [], updates = [], updateRows = [], seenIds = new Set();
    let syncedRows = [];
    let deletedRows = [];
    let metadataChanged = false;
    for(const row of getPopulatedApiRows(sheet, columns)){
      const record = apiRecordFromSheet(sheet, row, columns);
      let id = getRowServerId(sheet, row, columns);
      if(isApiRecordEmpty(record)){
        if(id) pendingServerDeletes.add(id);
        continue;
      }
      if(id && seenIds.has(id)) id = null;
      if(id) seenIds.add(id);
      if(id && backendRowsById.has(id)){
        const original = backendRowsById.get(id);
        const changed = {};
        columns.forEach(column => {
          if(API_CALCULATED_FIELDS.has(column.field)) return;
          const value = normalizeApiValue(column.field, record[column.field]);
          const previous = normalizeApiValue(column.field, original[column.field]);
          if(JSON.stringify(value) !== JSON.stringify(previous)) changed[column.field] = value;
        });
        if(Object.keys(changed).length){
          const changedFields = new Set(Object.keys(changed));
          columns.forEach(column => {
            if(!API_CALCULATED_FIELDS.has(column.field)) return;
            if(!API_CALCULATED_DEPENDENCIES[column.field].some(field => changedFields.has(field))) return;
            changed[column.field] = normalizeApiValue(column.field, record[column.field]);
          });
        }
        if(Object.keys(changed).length){
          updates.push({id: Number(id), row: changed});
          updateRows.push(row);
        }
      } else if(!id || !backendRowsById.has(id)){
        const cell = sheet.cells.get(refName(columns[0]?.col ?? 0, row)) || {};
        const fingerprint = apiRecordFingerprint(record);
        if(cell._localBaseline !== fingerprint){
          inserts.push({
            ...record,
            _allowDuplicateNumeroDa: Boolean(cell._allowDuplicateNumeroDa)
          });
          insertRows.push(row);
        }
      }
    }
    if(inserts.length || updates.length){
      const apiUrl = typeof window.apiUrl === "function" ? window.apiUrl : path => path;
      const response = await fetch(apiUrl("/api/achats/batch"), {
        method: "PUT",
        headers: {"Content-Type": "application/json", Authorization: "Bearer " + token},
        body: JSON.stringify({inserts, updates})
      });
      if(!response.ok) throw new Error("HTTP " + response.status + " - " + (await response.text()));
      const result = await response.json();
      const insertedRows = Array.isArray(result.inserted) ? result.inserted : [];
      const updatedRows = Array.isArray(result.updated) ? result.updated : [];
      syncedRows = [...insertedRows, ...updatedRows];
      if(insertedRows.length !== inserts.length || updatedRows.length !== updates.length){
        throw new Error("Le serveur n'a pas confirmé toutes les lignes enregistrées.");
      }
      insertedRows.forEach(function(saved, index){
        if(!saved || saved.id === undefined) return;
        const row = insertRows[index];
        const sentRecord = inserts[index];
        const currentRecord = apiRecordFromSheet(sheet, row, columns);
        if(apiRecordFingerprint(currentRecord) === apiRecordFingerprint(sentRecord)){
          const ownerColumn = columns.find(column => column.field === "acheteur");
          if(ownerColumn && saved.acheteur){
            const ownerRef = refName(ownerColumn.col, row);
            const ownerCell = Object.assign({}, sheet.cells.get(ownerRef) || {});
            ownerCell.v = saved.acheteur;
            sheet.cells.set(ownerRef, ownerCell);
          }
        }
        const markerColumn = columns.find(column => column.field === "numero_da") || columns[0];
        if(markerColumn){
          const markerRef = refName(markerColumn.col, row);
          const markerCell = Object.assign({}, sheet.cells.get(markerRef) || {});
          delete markerCell._allowDuplicateNumeroDa;
          sheet.cells.set(markerRef, markerCell);
        }
        setRowServerMetadata(sheet, row, columns, saved.id, undefined, apiRecordFingerprint(saved));
        backendRowsById.set(String(saved.id), saved);
        metadataChanged = true;
      });
      updatedRows.forEach(function(saved, index){
        if(saved && saved.id !== undefined){
          backendRowsById.set(String(saved.id), saved);
          const row = updateRows[index];
          if(row !== undefined) setRowServerMetadata(sheet, row, columns, saved.id, undefined, apiRecordFingerprint(saved));
          metadataChanged = true;
        }
      });
    }
    const removedIds = Array.from(pendingServerDeletes);
    if(removedIds.length){
      const apiUrl = typeof window.apiUrl === "function" ? window.apiUrl : path => path;
      const response = await fetch(apiUrl("/api/achats"), {
        method: "DELETE",
        headers: {"Content-Type": "application/json", Authorization: "Bearer " + token},
        body: JSON.stringify({ids: removedIds.map(Number)})
      });
      if(!response.ok) throw new Error("HTTP " + response.status + " - " + (await response.text()));
      const result = await response.json();
      const deletedIds = new Set((result.deleted || []).map(String));
      deletedRows = Array.from(deletedIds);
      deletedIds.forEach(id => {
        backendRowsById.delete(id);
        pendingServerDeletes.delete(id);
      });
      metadataChanged = true;
      if(removedIds.some(id => !deletedIds.has(String(id)))){
        saveLocal({ syncBackend: false });
        throw new Error("Certaines lignes n'ont pas pu être supprimées du serveur.");
      }
    }
    syncAllSheetRecords(syncedRows, deletedRows);
    syncDeliveredSheetRecords(syncedRows, deletedRows);
    syncInProgressSheetRecords(syncedRows, deletedRows);
    syncCommitteeSheetRecords(syncedRows, deletedRows);
    if(metadataChanged){
      invalidateAll();
      render();
      saveLocal({ syncBackend: false });
    }
    if(status){ status.className = ""; status.title = ""; }
    document.getElementById("saveText").textContent = "Enregistré et synchronisé";
    clearBackendRetry();
    return true;
  }catch(error){
    const syncError = getBackendSyncError(error);
    if(status){ status.className = "error"; status.title = syncError.message; }
    document.getElementById("saveText").textContent = syncError.message.length > 100
      ? syncError.message.slice(0, 97) + "..."
      : syncError.message;
    console.error("Synchronisation des achats impossible:", error);
    if(!(syncError.statusCode >= 400 && syncError.statusCode < 500)) scheduleBackendRetry(syncTableurWithBackend);
    return false;
  }finally{
    backendSyncRunning = false;
    if(backendSyncPending){
      backendSyncPending = false;
      const syncResult = await syncTableurWithBackend();
      const waiters = backendSyncWaiters.splice(0);
      waiters.forEach(resolve => resolve(syncResult));
    }
  }
}

async function serializeLocalData(data){
  const serialized = JSON.stringify(data);
  if(typeof CompressionStream === "undefined") return serialized;
  const compressedStream = new Blob([serialized]).stream().pipeThrough(new CompressionStream("gzip"));
  const bytes = new Uint8Array(await new Response(compressedStream).arrayBuffer());
  let binary = "";
  for(let offset = 0; offset < bytes.length; offset += 0x8000){
    binary += String.fromCharCode.apply(null, bytes.subarray(offset, offset + 0x8000));
  }
  return "gzip:" + btoa(binary);
}

async function parseLocalData(raw){
  if(!raw.startsWith("gzip:")) return JSON.parse(raw);
  if(typeof DecompressionStream === "undefined") throw new Error("La décompression du classeur n'est pas prise en charge par ce navigateur.");
  const binary = atob(raw.slice(5));
  const bytes = new Uint8Array(binary.length);
  for(let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
  const decompressedStream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(decompressedStream).text());
}

let saveRevision = 0;
function saveLocal(options = {}){
  const { syncBackend = true } = options;
  const revision = ++saveRevision;
  const el = document.getElementById("saveStatus");
  el.className = "saving";
  document.getElementById("saveText").textContent = "Enregistrement…";
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async function(){
    try{
      const data = {
        rows: ROWS, cols: COLS,
        activeSheetIdx: activeSheetIdx,
        pendingServerDeletes: Array.from(pendingServerDeletes),
        sheets: sheets.map(function(s){
          return {
            id: s.id, name: s.name, color: s.color, type: s.type,
            headers: s.headers, rows: s.rows,
            cells: Array.from(s.cells.entries())
          };
        })
      };
      const serializedData = await serializeLocalData(data);
      if(revision !== saveRevision) return;
      localStorage.setItem("tableur_da_v13", serializedData);
      if(backendSyncReady && syncBackend){
        syncTableurWithBackend();
        return;
      }
      const now = new Date();
      const timeStr = now.toLocaleTimeString("fr-FR", {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const dateStr = now.toLocaleDateString("fr-FR");
      el.className = "";
      el.title = "";
      document.getElementById("saveText").textContent = "Enregistré le " + dateStr + " à " + timeStr;
    }catch(e){
      if(revision !== saveRevision) return;
      el.className = "error";
      el.title = e && e.message ? e.message : String(e || "Erreur de sauvegarde locale inconnue");
      document.getElementById("saveText").textContent = "Erreur";
    }
  }, 800);
}

async function loadLocal(){
  try{
    ownerFiltersByName = loadOwnerFilters();
    const sheetFiltersById = loadSheetFilters();
    const raw = localStorage.getItem("tableur_da_v13");
    if(!raw) return false;
    const data = await parseLocalData(raw);
    pendingServerDeletes = new Set(Array.isArray(data.pendingServerDeletes) ? data.pendingServerDeletes.map(String) : []);
    if(typeof data.rows === "number") ROWS = data.rows;
    if(typeof data.cols === "number") COLS = data.cols;
    if(Array.isArray(data.sheets) && data.sheets.length > 0){
      const savedActiveSheetIndex = Number.isInteger(data.activeSheetIdx) ? data.activeSheetIdx : 0;
      const sheetsBeforeActive = data.sheets.slice(0, Math.max(0, savedActiveSheetIndex))
        .filter(function(s){ return s.type !== "parametres" }).length;
      const savedActiveSheet = data.sheets[savedActiveSheetIndex];
      sheets = data.sheets.filter(function(s){ return s.type !== "parametres" }).map(function(s){
        const sheet = {
          id: s.id, name: s.name, color: s.color, type: s.type,
          headers: s.headers, rows: EMPTY_ROWS_PER_SHEET + 1,
          cells: new Map(s.cells),
          filters: sheetFiltersById.get(String(s.id)) || new Map()
        };
        sheet.rows = getSheetRowCapacity(sheet);
        return sheet;
      });
      if(sheets.length){
        activeSheetIdx = savedActiveSheet && savedActiveSheet.type !== "parametres" ? sheetsBeforeActive : 0;
        if(activeSheetIdx >= sheets.length) activeSheetIdx = 0;
        syncActiveSheetRefs();
      }
    }
    return true;
  }catch(e){ return false }
}

function removeLegacyDemoRows(){
  const sheet = sheets.find(item => item.type === "colonne");
  if(!sheet) return;
  const columns = getApiColumns(sheet);
  const numeroDaColumn = columns.find(column => column.field === "numero_da");
  if(!numeroDaColumn) return;
  const legacyDemoDa = new Set(["DA-2026-001", "DA-2026-002", "DA-2026-003"]);
  const rowsToRemove = [];
  sheet.cells.forEach(function(cell, ref){
    const position = parseRef(ref);
    if(!position || position.r < 1 || position.c !== numeroDaColumn.col) return;
    if(legacyDemoDa.has(String(cell?.v || "").trim())) rowsToRemove.push(position.r);
  });
  rowsToRemove.forEach(function(row){
    for(const ref of Array.from(sheet.cells.keys())){
      const position = parseRef(ref);
      if(position && position.r === row) sheet.cells.delete(ref);
    }
  });
}

function migrateColumnSheetLayout(sheet){
  if(!sheet || !isDataSheet(sheet)) return false;
  const alreadyCurrent = COLONNE_HEADERS.every(function(column, index){
    return String(sheet.cells.get(refName(index, 0))?.v || "").trim() === column.header;
  });
  if(alreadyCurrent) return false;
  const allDefs = [...API_COLUMN_DEFS, ...HIDDEN_API_COLUMN_DEFS];
  const targetColumnsByField = new Map();
  API_COLUMN_DEFS.forEach(function(def){
    const target = COLONNE_HEADERS.findIndex(function(column){ return column.header === def[0] });
    if(target >= 0) targetColumnsByField.set(def[1], target);
  });
  HIDDEN_API_COLUMN_DEFS.forEach(function(def, index){
    targetColumnsByField.set(def[1], COLONNE_HEADERS.length + index);
  });

  const oldColumnsByField = new Map();
  const fieldByHeader = new Map();
  allDefs.forEach(function(def){
    [def[0], ...(API_COLUMN_HEADER_ALIASES[def[1]] || [])].forEach(function(header){
      fieldByHeader.set(header, def[1]);
    });
  });
  const maxColumn = Math.max(COLONNE_HEADERS.length, sheet.headers?.length || 0, COLS);
  for(let col = 0; col < maxColumn; col++){
    const header = String(sheet.cells.get(refName(col, 0))?.v || "").trim();
    const field = fieldByHeader.get(header);
    if(field && !oldColumnsByField.has(field)) oldColumnsByField.set(field, col);
  }
  HIDDEN_API_COLUMN_DEFS.forEach(function(def, index){
    if(!oldColumnsByField.has(def[1])) oldColumnsByField.set(def[1], COLONNE_HEADERS.length + index);
  });

  const fieldByOldColumn = new Map();
  oldColumnsByField.forEach(function(col, field){ fieldByOldColumn.set(col, field) });
  const remappedCells = new Map();
  sheet.cells.forEach(function(cell, ref){
    const position = parseRef(ref);
    if(!position || position.r === 0) return;
    const field = fieldByOldColumn.get(position.c);
    const targetCol = field && targetColumnsByField.get(field);
    if(Number.isInteger(targetCol)) remappedCells.set(refName(targetCol, position.r), cell);
  });

  COLONNE_HEADERS.forEach(function(column, targetCol){
    const oldCol = oldColumnsByField.get(API_COLUMN_DEFS.find(def => def[0] === column.header)?.[1]);
    const oldHeaderCell = Number.isInteger(oldCol) ? sheet.cells.get(refName(oldCol, 0)) : null;
    remappedCells.set(refName(targetCol, 0), {
      ...(oldHeaderCell || {}),
      v: column.header,
      s: oldHeaderCell?.s || {b: true}
    });
  });

  sheet.cells = remappedCells;
  sheet.headers = COLONNE_HEADERS;
  sheet.rows = getSheetRowCapacity(sheet);
  ownerRowsIndexCache = null;
  return true;
}

async function init(){
  if(!await loadLocal()) loadDemo();
  else if(!sheets.length) loadDemo();
  removeLegacyDemoRows();
  const currentSheet = sheets.find(item => item.type === "colonne");
  if(currentSheet){
    currentSheet.name = "En cours";
  }
  ensureAllSheet(currentSheet);
  ensureCommitteeSheets(currentSheet);
  const layoutChanged = sheets.reduce(function(changed, sheet){
    return migrateColumnSheetLayout(sheet) || changed;
  }, false);
  if(layoutChanged) saveLocal();
  await loadSheetConfiguration();
  ensureActiveSheetVisible();
  syncActiveSheetRefs();
  buildGrid();
  renderSheetTabs();
  setCurrent("A1");
  if(["colonne", "tous"].includes(activeSheet().type)){
    scrollToOwnerEntryRows();
    buildGrid();
  }
  render();
  document.getElementById("btnAddSheet").addEventListener("click", addSheet);

  document.getElementById("saveText").textContent = "Enregistré le " + dateStr + " à " + timeStr;
  initializeBackendSync().finally(focusOwnerDataAfterLoad);
}

async function loadSheetConfiguration(){
  const token = localStorage.getItem("authToken");
  if(!token){
    sheetSettingsLoaded = false;
    sheetSettingsByType.clear();
    ensureActiveSheetVisible();
    syncActiveSheetRefs();
    renderSheetTabs();
    buildGrid();
    render();
    return false;
  }
  try{
    const apiUrl = typeof window.apiUrl === "function"
      ? window.apiUrl
      : path => `${window.location.protocol === "file:" ? "http://localhost:8000" : window.location.origin}${path}`;
    const response = await fetch(apiUrl("/api/sheets/config"), {
      headers: {Authorization: "Bearer " + token},
      cache: "no-store"
    });
    if(!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if(!data || data.ok !== true || !Array.isArray(data.sheets)) throw new Error("Réponse API invalide");
    sheetSettingsByType = new Map(data.sheets.map(function(setting){
      return [setting.key, {
        name: setting.name,
        ownerName: setting.ownerName,
        visible: setting.visible === true,
        showEmptyRows: setting.showEmptyRows !== false
      }];
    }));
    const configuredOwners = data.sheets.filter(function(setting){
      return setting.ownerName && setting.key.startsWith("colonne_");
    });
    const ownerColors = ["#1a73e8", "#0f9d58", "#d93025", "#0097a7", "#7c3aed", "#f59e0b", "#db2777", "#475569"];
    const existingOwnersByKey = new Map(IN_PROGRESS_OWNERS.map(function(owner){ return [owner.key, owner] }));
    IN_PROGRESS_OWNERS = configuredOwners.map(function(setting, index){
      const existing = existingOwnersByKey.get(setting.key);
      return {
        name: setting.ownerName,
        key: setting.key,
        color: existing?.color || ownerColors[index % ownerColors.length]
      };
    });
    if(!IN_PROGRESS_OWNERS.some(function(owner){ return owner.name === activeOwnerFilter }) && IN_PROGRESS_OWNERS.length){
      activeOwnerFilter = IN_PROGRESS_OWNERS[0].name;
    }
    sheetSettingsLoaded = true;
    lastSheetSettingsRefresh = Date.now();
    sheets.forEach(function(sheet){
      if(sheet.type !== "colonne"){
        const setting = getSheetSetting(sheet);
        if(setting) sheet.name = setting.name;
      }
    });
    return true;
  }catch(error){
    console.error("Chargement de la configuration des feuilles impossible:", error);
    sheetSettingsLoaded = false;
    sheetSettingsByType.clear();
    ensureActiveSheetVisible();
    syncActiveSheetRefs();
    renderSheetTabs();
    buildGrid();
    render();
    showToast("Impossible de vérifier les accès aux feuilles ; les feuilles Achat sont masquées.");
    return false;
  }
}

window.refreshAchatSheetConfig = async function(force = false){
  if(!force && Date.now() - lastSheetSettingsRefresh < 10000) return false;
  if(!await loadSheetConfiguration()) return false;
  ensureActiveSheetVisible();
  renderSheetTabs();
  buildGrid();
  render();
  return true;
};

  window.refreshAchatSheetConfig();
});

  window.refreshAchatSheetConfig(true);
});
